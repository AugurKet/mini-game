<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Memory Flip+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body{
    margin:0;
    background:#0f172a;
    color:#e5e7eb;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .game{
    width:360px;
    background:#020617;
    border-radius:14px;
    padding:14px;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
  }
  h2{
    text-align:center;
    margin:8px 0 10px;
  }
  .top{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .pill{
    background:#0b1224;
    border:1px solid #1f2a44;
    padding:8px 10px;
    border-radius:12px;
    font-size:13px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .pill b{ color:#fff; }
  
  /* Group the dropdowns together */
  .dropdowns {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  
  select, button{
    border-radius:10px;
    border:1px solid #1f2a44;
    background:#0b1224;
    color:#e5e7eb;
    padding:8px 10px;
    font-size:14px;
    flex: 1; /* Makes dropdowns stretch evenly */
  }
  button{
    cursor:pointer;
    background:#2563eb;
    border:none;
  }
  button.secondary{
    background:#334155;
  }
  .grid{
    display:grid;
    gap:10px;
  }
  .card{
    background:#334155;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    user-select:none;
    height:70px;
    transition:transform .15s, background .15s;
    overflow: hidden; /* Keeps images inside borders */
  }
  .card.flipped{
    background:#22c55e;
    transform:scale(1.03);
  }
  .card.matched{
    background:#16a34a;
    cursor:default;
    opacity:.95;
  }
  /* Style for image-based cards */
  .card img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
    pointer-events: none; /* Prevents user from accidentally dragging the image */
  }
  .footer{
    margin-top:10px;
    display:flex;
    gap:10px;
  }
  .footer button{
    width:50%;
  }
  .hint{
    font-size:12px;
    opacity:.8;
    margin-top:8px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="game">
  <h2>Memory Flip+</h2>

  <div class="top">
    <div class="pill">Time: <b id="time">0.0</b>s</div>
    <div class="pill">Moves: <b id="moves">0</b></div>
    <div class="pill">Best: <b id="best">—</b></div>
  </div>

  <div class="dropdowns" style="margin-bottom: 10px;">
    <select id="themeSelect" title="Theme">
      <option value="emojis" selected>Emojis</option>
      <option value="cars">Cars Brand</option>
      <option value="Classics">Classics</option>
      <option value="water_margin">Water Margin</option>
    </select>

    <select id="difficulty" title="Difficulty">
      <option value="easy">Easy (4×3)</option>
      <option value="medium" selected>Medium (4×4)</option>
      <option value="hard">Hard (6×4)</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <button id="start">Start</button>
    <button id="restart" class="secondary">Restart</button>
  </div>

  <div class="hint">Tip: Click Start, then match all pairs with fewer moves and faster time.</div>
</div>

<script>
  // ---------- Config ----------
  
  // New Theme Configuration Object
  const THEMES = {
    emojis: {
      type: 'text',
      items: ["🍎","🍌","🍇","🍒","🍋","🍉","🥝","🍓","🥑","🍑","🍍","🥥","🍈","🍏","🍐","🍊","🍔","🍕","🍩","🍪"]
    },
    cars: {
      type: 'image',
      folder: 'themes/cars/',
      // Update these filenames to match the actual images in your folder. 
      // Minimum 12 items needed for Hard mode!
      items: ['bmw.png', 'audi.png', 'toyota.png', 'tesla.png', 'honda.png', 'nissan.png', 'mercedes.png', 'minicooper.png', 'porsche.png', 'ferrari.png', 'lamborghini.png', 'renault.png']
    },
    Classics: {
      type: 'image',
      folder: 'themes/Classics/',
      // Update these filenames to match the actual images in your folder. 
      // Minimum 12 items needed for Hard mode!
      items: ['3floppydisk.jpg', '5floppydisk.jpeg', 'crtmonitor.jpeg', 'gameboy.jpeg', 'icq.png', 'msdosprompt.png', 'netscapenavigator.jpeg', 'vhstape.webp', 'walkman.jpeg', 'winamp.png', 'windows95.jpeg', 'zipdisk.jpeg']
    },
    water_margin: {
      type: 'image',
      folder: 'themes/water_margin/',
      // Update these filenames to match the actual images in your folder.
      // Minimum 12 items needed for Hard mode!
      items: ['songjiang.png', 'linchong.png', 'wusong.png', 'luzhishen.png', 'likui.png', 'chaogai.png', 'wuyong.png', 'gongsunsheng.png', 'huarong.png', 'chaijin.png', 'lujunyi.png', 'yanqing.png']
    }
  };

  const DIFF = {
    easy:   { cols: 4, rows: 3 }, // 12 cards / 6 pairs
    medium: { cols: 4, rows: 4 }, // 16 cards / 8 pairs
    hard:   { cols: 6, rows: 4 }  // 24 cards / 12 pairs
  };

  // ---------- State ----------
  const grid = document.getElementById("grid");
  const timeEl = document.getElementById("time");
  const movesEl = document.getElementById("moves");
  const bestEl = document.getElementById("best");
  const difficultyEl = document.getElementById("difficulty");
  const themeEl = document.getElementById("themeSelect");
  const startBtn = document.getElementById("start");
  const restartBtn = document.getElementById("restart");

  let first = null;
  let lock = false;
  let moves = 0;
  let matchedCount = 0;
  let started = false;

  let startTs = 0;
  let rafId = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function bestKey(diff, theme) {
    return `memory_best_${theme}_${diff}`;
  }

  function loadBest(diff, theme) {
    const raw = localStorage.getItem(bestKey(diff, theme));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }

  function saveBest(diff, theme, record) {
    localStorage.setItem(bestKey(diff, theme), JSON.stringify(record));
  }

  function formatBest(rec) {
    if (!rec) return "—";
    return `${rec.time.toFixed(1)}s / ${rec.moves}m`;
  }

  function updateBestUI() {
    const diff = difficultyEl.value;
    const theme = themeEl.value;
    bestEl.textContent = formatBest(loadBest(diff, theme));
  }

  function setGridLayout(cols, rows) {
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    const cardHeight = (cols >= 6) ? 62 : 70;
    grid.querySelectorAll(".card").forEach(c => c.style.height = cardHeight + "px");
  }

  function stopTimer() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function tick() {
    if (!started) return;
    const t = (performance.now() - startTs) / 1000;
    timeEl.textContent = t.toFixed(1);
    rafId = requestAnimationFrame(tick);
  }

  function resetStats() {
    first = null;
    lock = false;
    moves = 0;
    matchedCount = 0;
    started = false;
    stopTimer();
    timeEl.textContent = "0.0";
    movesEl.textContent = "0";
  }

  function buildBoard() {
    resetStats();
    updateBestUI();

    const diff = difficultyEl.value;
    const themeKey = themeEl.value;
    const currentTheme = THEMES[themeKey];
    
    const { cols, rows } = DIFF[diff];
    const totalCards = cols * rows;
    const pairs = totalCards / 2;

    // Check if the theme has enough items for the difficulty
    if (currentTheme.items.length < pairs) {
        alert(`Error: You need at least ${pairs} items in the "${themeKey}" theme for this difficulty.`);
        return;
    }

    // Pick enough unique items based on selected theme
    const picks = shuffle(currentTheme.items).slice(0, pairs);
    const cards = shuffle([...picks, ...picks]);

    grid.innerHTML = "";
    grid.dataset.total = String(totalCards);

    cards.forEach(icon => {
      const div = document.createElement("div");
      div.className = "card";
      div.textContent = "❓";          // face-down state
      div.dataset.icon = icon;
      div.addEventListener("click", () => flip(div));
      grid.appendChild(div);
    });

    setGridLayout(cols, rows);
  }

  function reveal(card) {
    card.classList.add("flipped");
    const themeKey = themeEl.value;
    const currentTheme = THEMES[themeKey];

    // Check if we are rendering text (emojis) or HTML (images)
    if (currentTheme.type === 'text') {
      card.textContent = card.dataset.icon;
    } else {
      // Build the image tag dynamically
      card.innerHTML = `<img src="${currentTheme.folder}${card.dataset.icon}" alt="card">`;
    }
  }

  function hide(card) {
    card.classList.remove("flipped");
    card.textContent = "❓"; // Overwrites the image tag or emoji back to a question mark
  }

  function markMatched(card) {
    card.classList.add("matched");
  }

  function maybeStartTimer() {
    if (started) return;
    started = true;
    startTs = performance.now();
    tick();
  }

  function finishGame() {
    started = false;
    stopTimer();

    const diff = difficultyEl.value;
    const theme = themeEl.value;
    const time = parseFloat(timeEl.textContent);
    const record = loadBest(diff, theme);

    const current = { time, moves };
    const isBetter =
      !record ||
      time < record.time ||
      (time === record.time && moves < record.moves);

    if (isBetter) saveBest(diff, theme, current);
    updateBestUI();

    setTimeout(() => {
      alert(isBetter
        ? `🎉 New Best on ${diff.toUpperCase()} (${theme})!\nTime: ${time.toFixed(1)}s\nMoves: ${moves}`
        : `✅ Completed!\nTime: ${time.toFixed(1)}s\nMoves: ${moves}`);
    }, 50);
  }

  function flip(card) {
    if (lock) return;
    if (card.classList.contains("matched")) return;
    if (card === first) return;

    maybeStartTimer();
    reveal(card);

    if (!first) {
      first = card;
      return;
    }

    moves++;
    movesEl.textContent = String(moves);

    lock = true;
    const a = first;
    const b = card;

    setTimeout(() => {
      if (a.dataset.icon === b.dataset.icon) {
        markMatched(a);
        markMatched(b);
        matchedCount += 2;
      } else {
        hide(a);
        hide(b);
      }

      first = null;
      lock = false;

      const total = parseInt(grid.dataset.total, 10);
      if (matchedCount >= total) finishGame();
    }, 550);
  }

  // ---------- UI Events ----------
  difficultyEl.addEventListener("change", () => {
    buildBoard();
  });

  themeEl.addEventListener("change", () => {
    buildBoard();
  });

  startBtn.addEventListener("click", () => {
    buildBoard();
  });

  restartBtn.addEventListener("click", () => {
    buildBoard();
  });

  // initial load
  buildBoard();
</script>

</body>
</html>
