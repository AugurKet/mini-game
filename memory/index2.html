<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Memory Flip+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body{
    margin:0;
    background:#0f172a;
    color:#e5e7eb;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  
  /* Responsive Game Container */
  .game{
    width: 92%;
    max-width: 380px; /* Mobile Default */
    background:#020617;
    border-radius:14px;
    padding:16px;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
    transition: max-width 0.3s ease, padding 0.3s ease;
  }
  
  h2{
    text-align:center;
    margin:8px 0 10px;
    transition: font-size 0.3s ease;
  }
  .top{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .pill{
    background:#0b1224;
    border:1px solid #1f2a44;
    padding:8px 10px;
    border-radius:12px;
    font-size:13px;
    display:flex;
    gap:8px;
    align-items:center;
    flex: 1;
    justify-content: center;
  }
  .pill b{ color:#fff; }
  
  .dropdowns {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-bottom: 10px;
  }
  
  select, button{
    border-radius:10px;
    border:1px solid #1f2a44;
    background:#0b1224;
    color:#e5e7eb;
    padding:10px;
    font-size:14px;
    flex: 1;
  }
  button{
    cursor:pointer;
    background:#2563eb;
    border:none;
    font-weight: bold;
    transition: background 0.2s;
  }
  button:hover {
    background:#1d4ed8;
  }
  button.secondary{
    background:#334155;
  }
  button.secondary:hover {
    background:#475569;
  }
  
  .grid{
    display:grid;
    gap:10px;
  }
  
  /* Card Styling - Heights are now controlled by CSS */
  .card{
    background:#334155;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    user-select:none;
    height:70px; /* Mobile Default */
    transition:transform .15s, background .15s;
    overflow: hidden;
  }
  
  /* Slightly smaller cards on mobile for Hard mode */
  .grid.hard-layout .card {
    height: 60px;
  }
  
  .card.flipped{
    background:#22c55e;
    transform:scale(1.03);
  }
  .card.matched{
    background:#16a34a;
    cursor:default;
    opacity:.95;
  }
  .card img {
   width: 100%;
    height: 100%;
    object-fit: cover; /* Stretches and crops to fill the box completely */
    pointer-events: none;
    border-radius: 8px; /* Matches the card's inner curves */
  }
  
  .footer{
    margin-top:10px;
    display:flex;
    gap:10px;
  }
  .hint{
    font-size:12px;
    opacity:.8;
    margin-top:10px;
    text-align:center;
  }

  /* --- DESKTOP / WIDER SCREEN MEDIA QUERY --- */
  @media (min-width: 600px) {
    .game {
      max-width: 650px; /* Expands on PC */
      padding: 24px;
    }
    h2 {
      font-size: 28px;
      margin-bottom: 16px;
    }
    .pill {
      font-size: 15px;
      padding: 10px 14px;
    }
    select, button {
      font-size: 16px;
      padding: 12px;
    }
    .card {
      height: 110px; /* Much taller cards on PC */
      font-size: 48px; /* Bigger emojis */
      border-radius: 14px;
    }
    .grid.hard-layout .card {
      height: 90px; /* Keep Hard mode cards fitting cleanly */
    }
    .grid {
      gap: 14px; /* Slightly wider gaps on PC */
    }
  }

  /* --- CUSTOM MODAL STYLES --- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: #020617;
    border: 1px solid #1f2a44;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    width: 85%;
    max-width: 340px;
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }
  .modal-overlay.active .modal {
    transform: scale(1);
  }
  .modal h3 {
    margin: 0 0 15px;
    font-size: 26px;
  }
  .modal .stats {
    background: #0b1224;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 16px;
    line-height: 1.6;
    color: #cbd5e1;
  }
  .modal .stats b {
    color: #fff;
  }
</style>
</head>
<body>

<div class="game">
  <h2>Memory Flip+</h2>

  <div class="top">
    <div class="pill">Time: <b id="time">0.0</b>s</div>
    <div class="pill">Moves: <b id="moves">0</b></div>
    <div class="pill">Best: <b id="best">—</b></div>
  </div>
 
  <div class="dropdowns">
    <select id="themeSelect" title="Theme">
      <option value="emojis" selected>Emojis</option>
      <option value="cars">Cars Brand</option>
      <option value="footballer">Football Players</option>
      <option value="classicHKcomedians">HK Comedians from 80s</option>
      <option value="80sPopStarsW">HK Actress from 90s</option>
      <option value="Classics">Classics</option>
      <option value="water_margin">Water Margin</option>
    </select>

    <select id="difficulty" title="Difficulty">
      <option value="easy">Easy (4×3)</option>
      <option value="medium" selected>Medium (4×4)</option>
      <option value="hard">Hard (6×4)</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <button id="start">Start</button>
    <button id="restart" class="secondary">Restart</button>
  </div>

  <div class="hint">Tip: Click Start, then match all pairs with fewer moves and faster time.</div>
</div>

<div id="victoryModal" class="modal-overlay">
  <div class="modal">
    <h3 id="modalTitle">🎉 New Best!</h3>
    <div class="stats" id="modalStats">
      </div>
    <button id="modalBtn">Play Again</button>
  </div>
</div>

<script>
  // ---------- Config ----------
  const THEMES = {
    emojis: {
      type: 'text',
      items: ["🍎","🍌","🍇","🍒","🍋","🍉","🥝","🍓","🥑","🍑","🍍","🥥","🍈","🍏","🍐","🍊","🍔","🍕","🍩","🍪"]
    },
    cars: {
      type: 'image',
      folder: 'themes/cars/',
      items: ['bmw.png', 'alfaromeo.png', 'toyota.png', 'tesla.png', 'honda.png', 'nissan.png', 'mercedes.png', 'minicooper.png', 'porsche.png', 'ferrari.png', 'lamborghini.png', 'renault.png']
    },
    cars: {
      type: 'footballer',
      folder: 'themes/footballer/',
      items: ['bmw.png', 'alfaromeo.png', 'toyota.png', 'tesla.png', 'honda.png', 'nissan.png', 'mercedes.png', 'minicooper.png', 'porsche.png', 'ferrari.png', 'lamborghini.png', 'renault.png']
    },
    classicHKcomedians: {
      type: 'image',
      folder: 'themes/classicHKcomedians/',
      items: ['caochali.jpeg', 'chenbaixiang.jpg', 'fengsuifan.jpeg', 'hongjinbao.jpeg', 'lounanguang.jpeg', 'qinxianglin.jpeg', 'shenjianxun.jpeg', 'wangjing.jpeg', 'wuyaohan.jpeg', 'zengzhiwei.jpeg', 'zhengdansui.jpg', 'zhourunfa.jpg']
    },
    '80sPopStarsW': { 
      type: 'image',
      folder: 'themes/80sPopStarsW/',
      items: ['zhouhuimin.jpeg', 'zhangmanyu.jpeg', 'lijiaxin.jpeg', 'yangling.webp', 'lanjieying.jpeg', 'zhouhaimei.jpeg', 'zhongchuhong.jpeg', 'guanzhilin.jpeg', 'wangzhuxian.jpeg', 'zhangmin.jpeg', 'wenbixia.jpeg', 'qiushuzhen.jpeg', 'zhuyin.jpeg', 'lizhi.jpeg']
    },
    Classics: {
      type: 'image',
      folder: 'themes/Classics/',
      items: ['3floppydisk.jpg', '5floppydisk.jpeg', 'crtmonitor.jpeg', 'gameboy.jpeg', 'icq.png', 'msdosprompt.png', 'netscapenavigator.jpeg', 'vhstape.webp', 'walkman.jpeg', 'winamp.png', 'windows95.jpeg', 'zipdisk.jpeg']
    },
    water_margin: {
      type: 'image',
      folder: 'themes/water_margin/',
      items: ['songjiang.png', 'linchong.png', 'wusong.png', 'luzhishen.png', 'likui.png', 'chaogai.png', 'wuyong.png', 'gongsunsheng.png', 'huarong.png', 'chaijin.png', 'lujunyi.png', 'yanqing.png']
    }
  };

  const DIFF = {
    easy:   { cols: 4, rows: 3 }, // 12 cards / 6 pairs
    medium: { cols: 4, rows: 4 }, // 16 cards / 8 pairs
    hard:   { cols: 6, rows: 4 }  // 24 cards / 12 pairs
  };

  // ---------- State ----------
  const grid = document.getElementById("grid");
  const timeEl = document.getElementById("time");
  const movesEl = document.getElementById("moves");
  const bestEl = document.getElementById("best");
  const difficultyEl = document.getElementById("difficulty");
  const themeEl = document.getElementById("themeSelect");
  const startBtn = document.getElementById("start");
  const restartBtn = document.getElementById("restart");
  
  // Modal Elements
  const victoryModal = document.getElementById("victoryModal");
  const modalTitle = document.getElementById("modalTitle");
  const modalStats = document.getElementById("modalStats");
  const modalBtn = document.getElementById("modalBtn");

  let first = null;
  let lock = false;
  let moves = 0;
  let matchedCount = 0;
  let started = false;

  let startTs = 0;
  let rafId = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function bestKey(diff, theme) {
    return `memory_best_${theme}_${diff}`;
  }

  function loadBest(diff, theme) {
    const raw = localStorage.getItem(bestKey(diff, theme));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }

  function saveBest(diff, theme, record) {
    localStorage.setItem(bestKey(diff, theme), JSON.stringify(record));
  }

  function formatBest(rec) {
    if (!rec) return "—";
    return `${rec.time.toFixed(1)}s / ${rec.moves}m`;
  }

  function updateBestUI() {
    const diff = difficultyEl.value;
    const theme = themeEl.value;
    bestEl.textContent = formatBest(loadBest(diff, theme));
  }

  function setGridLayout(cols, rows) {
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    // Add a helper class to CSS for Hard mode spacing instead of hardcoded JS pixels
    if(cols >= 6) {
      grid.classList.add('hard-layout');
    } else {
      grid.classList.remove('hard-layout');
    }
  }

  function stopTimer() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function tick() {
    if (!started) return;
    const t = (performance.now() - startTs) / 1000;
    timeEl.textContent = t.toFixed(1);
    rafId = requestAnimationFrame(tick);
  }

  function resetStats() {
    first = null;
    lock = false;
    moves = 0;
    matchedCount = 0;
    started = false;
    stopTimer();
    timeEl.textContent = "0.0";
    movesEl.textContent = "0";
  }

  function buildBoard() {
    resetStats();
    updateBestUI();

    const diff = difficultyEl.value;
    const themeKey = themeEl.value;
    const currentTheme = THEMES[themeKey];
   
    const { cols, rows } = DIFF[diff];
    const totalCards = cols * rows;
    const pairs = totalCards / 2;

    if (currentTheme.items.length < pairs) {
        alert(`Error: You need at least ${pairs} items in the "${themeKey}" theme for this difficulty.`);
        return;
    }

    const picks = shuffle(currentTheme.items).slice(0, pairs);
    const cards = shuffle([...picks, ...picks]);

    grid.innerHTML = "";
    grid.dataset.total = String(totalCards);

    cards.forEach(icon => {
      const div = document.createElement("div");
      div.className = "card";
      div.textContent = "❓";
      div.dataset.icon = icon;
      div.addEventListener("click", () => flip(div));
      grid.appendChild(div);
    });

    setGridLayout(cols, rows);
  }

  function reveal(card) {
    card.classList.add("flipped");
    const themeKey = themeEl.value;
    const currentTheme = THEMES[themeKey];

    if (currentTheme.type === 'text') {
      card.textContent = card.dataset.icon;
    } else {
      card.innerHTML = `<img src="${currentTheme.folder}${card.dataset.icon}" alt="card">`;
    }
  }

  function hide(card) {
    card.classList.remove("flipped");
    card.textContent = "❓"; 
  }

  function markMatched(card) {
    card.classList.add("matched");
  }

  function maybeStartTimer() {
    if (started) return;
    started = true;
    startTs = performance.now();
    tick();
  }

  function showVictoryModal(isBetter, time, moves, diffText) {
    if (isBetter) {
      modalTitle.textContent = "🎉 New Best!";
      modalTitle.style.color = "#22c55e"; 
    } else {
      modalTitle.textContent = "✅ Completed!";
      modalTitle.style.color = "#e5e7eb";
    }
    
    modalStats.innerHTML = `Difficulty: <b>${diffText}</b><br>Time: <b>${time.toFixed(1)}s</b><br>Moves: <b>${moves}</b>`;
    victoryModal.classList.add("active");
  }

  function finishGame() {
    started = false;
    stopTimer();

    const diff = difficultyEl.value;
    const diffText = difficultyEl.options[difficultyEl.selectedIndex].text;
    const theme = themeEl.value;
    const time = parseFloat(timeEl.textContent);
    const record = loadBest(diff, theme);

    const current = { time, moves };
    const isBetter =
      !record ||
      time < record.time ||
      (time === record.time && moves < record.moves);

    if (isBetter) saveBest(diff, theme, current);
    updateBestUI();

    // Show modal after a slight delay so the final card finishes flipping
    setTimeout(() => {
      showVictoryModal(isBetter, time, moves, diffText);
    }, 400);
  }

  function flip(card) {
    if (lock) return;
    if (card.classList.contains("matched")) return;
    if (card === first) return;

    maybeStartTimer();
    reveal(card);

    if (!first) {
      first = card;
      return;
    }

    moves++;
    movesEl.textContent = String(moves);

    lock = true;
    const a = first;
    const b = card;

    setTimeout(() => {
      if (a.dataset.icon === b.dataset.icon) {
        markMatched(a);
        markMatched(b);
        matchedCount += 2;
      } else {
        hide(a);
        hide(b);
      }

      first = null;
      lock = false;

      const total = parseInt(grid.dataset.total, 10);
      if (matchedCount >= total) finishGame();
    }, 550);
  }

  // ---------- UI Events ----------
  difficultyEl.addEventListener("change", buildBoard);
  themeEl.addEventListener("change", buildBoard);
  startBtn.addEventListener("click", buildBoard);
  restartBtn.addEventListener("click", buildBoard);
  
  modalBtn.addEventListener("click", () => {
    victoryModal.classList.remove("active");
    buildBoard();
  });

  // initial load
  buildBoard();
</script>

</body>
</html>
