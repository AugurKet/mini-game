<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vision Test — Color Difference</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root{
    --bg:#0f172a; --panel:#020617; --ink:#e5e7eb;
    --muted:#94a3b8; --line:#1f2a44; --btn:#2563eb; --btn2:#334155;
  }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: Arial, sans-serif; display:flex;
    justify-content:center; align-items:center; min-height:100vh;
  }
  .wrap{
    width:100%; max-width:420px; background:var(--panel);
    border-radius:14px; padding:16px; box-shadow:0 15px 40px rgba(0,0,0,.6);
  }
  h2{ margin:6px 0; text-align:center; }
  .sub{ margin-bottom:12px; text-align:center; color:var(--muted); font-size:13px; }
  
  .top{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:10px; }
  .pill{ background:#0b1224; border:1px solid var(--line); padding:8px; border-radius:12px; font-size:13px; text-align: center; }
  
  .controls{ display:flex; gap:10px; margin-bottom:10px; }
  button, select{ border-radius:10px; border:1px solid var(--line); background:#0b1224; color:var(--ink); padding:10px; font-size:14px; }
  button{ cursor:pointer; background:var(--btn); border:none; flex:1; font-weight:bold; }
  button.secondary{ background:var(--btn2); }
  select{ flex:1; }

  .grid{ display:grid; gap:6px; margin:10px 0; touch-action: manipulation; }
  .tile{ border-radius:8px; cursor:pointer; border:1px solid rgba(255,255,255,.05); position: relative; }

  /* CRITICAL FIXES FOR THE OUTLINE */
  .tile.answer {
    outline: 4px solid #22c55e !important;
    outline-offset: -4px !important; /* Forces outline INSIDE the tile */
    z-index: 100;
    box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
  }

  .tile.wrong {
    outline: 4px solid #ef4444 !important;
    outline-offset: -4px !important; /* Forces outline INSIDE the tile */
    z-index: 100;
    animation: shake 0.25s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .panel { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-top: 10px; }
  .tag{ display:inline-block; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:11px; margin: 2px; background:#071022; }
  .hidden{ display:none; }
</style>
</head>
<body>

<div class="wrap">
  <h2>Vision Test</h2>
  <div class="sub">Find the tile with the different color.</div>

  <div class="top">
    <div class="pill">Level: <b id="level">1</b></div>
    <div class="pill">Best: <b id="best">—</b></div>
    <div class="pill">Mistakes: <b id="mistakes">0</b></div>
    <div class="pill">Time: <b id="time">0.0</b>s</div>
  </div>

  <div class="controls">
    <select id="mode">
      <option value="standard">Standard</option>
      <option value="hard">Hard</option>
      <option value="training">Training</option>
    </select>
    <button id="start">Start</button>
    <button class="secondary" id="reset">Reset</button>
  </div>

  <div id="grid" class="grid"></div>

  <div class="panel" id="resultPanel">
    <div id="resultTags"></div>
    <p id="resultText" style="font-size:13px; color:var(--muted);">Press Start to begin.</p>
  </div>
</div>

<script>
  const gridEl = document.getElementById("grid");
  const levelEl = document.getElementById("level");
  const timeEl = document.getElementById("time");
  const mistakesEl = document.getElementById("mistakes");
  const bestEl = document.getElementById("best");
  const modeEl = document.getElementById("mode");
  const startBtn = document.getElementById("start");
  const resultText = document.getElementById("resultText");
  const resultTags = document.getElementById("resultTags");

  let level = 1, mistakes = 0, started = false, canClick = true, startTs = 0, rafId = 0, answerIndex = 0;

  function updateBestUI(){
    const b = localStorage.getItem("vision_best_" + modeEl.value) || "—";
    bestEl.textContent = b;
  }

  function tick(){
    if (!started) return;
    timeEl.textContent = ((performance.now() - startTs)/1000).toFixed(1);
    rafId = requestAnimationFrame(tick);
  }

  function buildBoard(){
    const mode = modeEl.value;
    const size = Math.min(2 + Math.floor(level/3), 8);
    let delta = (mode === "training") ? (60 - level*1.5) : (mode === "hard" ? (40 - level*2.5) : (50 - level*2));
    delta = Math.max(delta, 4);

    gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    gridEl.innerHTML = "";
    
    const r = Math.floor(60 + Math.random()*130), g = Math.floor(60 + Math.random()*130), b = Math.floor(60 + Math.random()*130);
    const base = `rgb(${r},${g},${b})`;
    
    const ch = Math.floor(Math.random()*3);
    const diffColor = [r,g,b];
    diffColor[ch] = Math.min(255, Math.max(0, diffColor[ch] + (Math.random() < 0.5 ? -delta : delta)));
    const diff = `rgb(${diffColor[0]},${diffColor[1]},${diffColor[2]})`;

    answerIndex = Math.floor(Math.random() * (size * size));

    for (let i=0; i < (size*size); i++){
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.style.height = (size > 6 ? "40px" : "60px");
      tile.style.background = (i === answerIndex) ? diff : base;
      tile.onclick = () => onPick(i, tile);
      gridEl.appendChild(tile);
    }
    levelEl.textContent = level;
  }

  function onPick(i, el){
    if (!started || !canClick) return;
    if (i === answerIndex){
      level++; buildBoard();
    } else {
      canClick = false; started = false;
      mistakes++; mistakesEl.textContent = mistakes;
      
      // SHOW OUTLINES
      el.classList.add('wrong');
      gridEl.children[answerIndex].classList.add('answer');

      setTimeout(() => {
        const best = parseInt(localStorage.getItem("vision_best_" + modeEl.value) || 0);
        if (level > best) localStorage.setItem("vision_best_" + modeEl.value, level);
        updateBestUI();
        resultText.textContent = `Game Over. You reached Level ${level}. The correct tile is highlighted in green.`;
      }, 500);
    }
  }

  startBtn.onclick = () => {
    level = 1; mistakes = 0; canClick = true; started = true;
    startTs = performance.now();
    tick(); buildBoard();
    resultText.textContent = "Find the odd tile!";
  };

  document.getElementById("reset").onclick = () => location.reload();
  modeEl.onchange = updateBestUI;
  updateBestUI(); buildBoard();
</script>
</body>
</html>
