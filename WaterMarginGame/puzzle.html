<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>破阵试炼：祝家庄盘陀路</title>
    <style>
        body { 
            font-family: "Microsoft YaHei", sans-serif; 
            background-color: #f4ecd8; 
            text-align: center; 
            padding: 20px; 
            color: #333; 
            margin: 0;
            background-image: url('images/bg.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
        }

        .container { 
            background: rgba(255, 250, 240, 0.95); 
            border: 4px solid #5c3a21; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 450px; 
            margin: 0 auto; 
            padding: 20px; 
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6); 
        }

        h1 { color: #8b0000; font-size: 24px; margin-bottom: 10px; border-bottom: 2px dashed #b89f7d; padding-bottom: 10px; }
        p.desc { font-size: 14px; color: #555; margin-bottom: 20px; font-weight: bold; }

        /* 拼图外框 */
        .puzzle-board {
            width: 400px;
            height: 400px;
            margin: 0 auto;
            position: relative;
            border: 4px solid #4a3320;
            background-color: #222; /* 底部黑色 */
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            perspective: 1000px; /* 开启3D，为最后翻转做准备 */
        }

        /* 拼图的每一个小块 */
        .tile {
            width: 100px;
            height: 100px;
            position: absolute;
            border: 1px solid #e8dcc4;
            box-sizing: border-box;
            background-image: url('Images2/IMG_1698.png'); /* 这里用咱们那张霸气的背景图作为拼图 */
            background-size: 400px 400px; /* 强制背景图尺寸和画板一样大 */
            cursor: pointer;
            transition: top 0.2s ease, left 0.2s ease, transform 0.6s ease; /* 滑动动画 */
            transform-style: preserve-3d;
        }

        /* 空白块隐藏背景（呈现底部的黑色） */
        .tile.empty {
            background-image: none !important;
            border: none;
            cursor: default;
        }

        /* 胜利时，第16块的翻转动画 */
        .tile.win-flip {
            background-image: url('Images2/IMG_1698.png') !important;
            animation: flipIn 0.8s ease forwards;
        }

        @keyframes flipIn {
            0% { transform: rotateY(-180deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; border: none; }
        }

        .btn { background-color: #8b0000; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; margin-top: 20px; }
        .btn:hover { background-color: #5c3a21; transform: translateY(-2px); }

        #victoryMsg { display: none; color: #2e8b57; font-size: 22px; font-weight: bold; margin-top: 15px; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>盘陀路阵法</h1>
    <p class="desc">拨开迷雾，复原阵图。找出祝家庄的生门！</p>

    <div class="puzzle-board" id="board">
        </div>

    <div id="victoryMsg">✨ 阵法已破！生门大开！ ✨</div>
    <button class="btn" onclick="startGame()">打乱阵法 (重新开始)</button>
</div>

<audio id="sndSlide" src="correct.mp3"></audio> <script>
    const boardSize = 4; // 4x4 网格
    const tileSize = 100; // 每个方块 100px
    let tiles = []; // 记录当前每个位置上是几号方块
    let isWon = false;

    // 初始化 0-15 的数组 (15 代表第16个空格子)
    function initTiles() {
        tiles = [];
        for (let i = 0; i < boardSize * boardSize; i++) {
            tiles.push(i);
        }
    }

    // 渲染拼图到页面上
    function renderBoard(animate = true) {
        const board = document.getElementById('board');
        board.innerHTML = '';

        for (let i = 0; i < tiles.length; i++) {
            const tileValue = tiles[i]; // 当前这个位置放的是几号图
            
            const tileEl = document.createElement('div');
            tileEl.className = 'tile';
            
            // 计算当前方块在棋盘上的行列 (用来绝对定位)
            const row = Math.floor(i / boardSize);
            const col = i % boardSize;
            
            tileEl.style.top = (row * tileSize) + 'px';
            tileEl.style.left = (col * tileSize) + 'px';

            if (!animate) {
                tileEl.style.transition = 'none'; // 初始化和打乱时不播放滑动动画
            }

            if (tileValue === 15) {
                tileEl.classList.add('empty');
                tileEl.id = 'emptyTile'; // 记录那个空格子
            } else {
                // 计算这块图原本在整张大图里的位置 (障眼法核心！)
                const originalRow = Math.floor(tileValue / boardSize);
                const originalCol = tileValue % boardSize;
                tileEl.style.backgroundPosition = `-${originalCol * tileSize}px -${originalRow * tileSize}px`;
            }

            // 点击事件
            tileEl.onclick = () => handleTileClick(i);

            board.appendChild(tileEl);
        }
    }

    // 处理点击滑动
    function handleTileClick(index) {
        if (isWon) return;

        const emptyIndex = tiles.indexOf(15); // 找到空格子的当前位置
        const validMoves = getValidMoves(emptyIndex); // 获取空格子周围能滑动的格子

        if (validMoves.includes(index)) {
            // 如果点击的格子在空格子旁边，交换它们
            [tiles[emptyIndex], tiles[index]] = [tiles[index], tiles[emptyIndex]];
            
            // 播放声音 (可选)
            document.getElementById('sndSlide').currentTime = 0;
            document.getElementById('sndSlide').play().catch(e=>{});

            renderBoard(true); // 重新渲染（带滑动动画）
            
            checkWin();
        }
    }

    // 获取空格子上下左右合法的索引
    function getValidMoves(emptyIdx) {
        const moves = [];
        const row = Math.floor(emptyIdx / boardSize);
        const col = emptyIdx % boardSize;

        if (row > 0) moves.push(emptyIdx - boardSize); // 上
        if (row < boardSize - 1) moves.push(emptyIdx + boardSize); // 下
        if (col > 0) moves.push(emptyIdx - 1); // 左
        if (col < boardSize - 1) moves.push(emptyIdx + 1); // 右

        return moves;
    }

    // 绝对有解的洗牌算法：模拟电脑盲滑 300 步
    function shuffleTiles() {
        for (let i = 0; i < 300; i++) {
            const emptyIndex = tiles.indexOf(15);
            const validMoves = getValidMoves(emptyIndex);
            // 随机选一个能滑动的格子，滑进空格
            const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            [tiles[emptyIndex], tiles[randomMove]] = [tiles[randomMove], tiles[emptyIndex]];
        }
    }

    // 检查是否拼图完成
    function checkWin() {
        let won = true;
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i] !== i) {
                won = false;
                break;
            }
        }

        if (won) {
            isWon = true;
            document.getElementById('victoryMsg').style.display = 'block';
            
            // 触发大当家要求的：第16块翻转现出原图！
            const emptyTile = document.getElementById('emptyTile');
            emptyTile.classList.remove('empty');
            emptyTile.classList.add('win-flip');
            
            // 把那块缺失位置的原图补上
            const originalRow = Math.floor(15 / boardSize);
            const originalCol = 15 % boardSize;
            emptyTile.style.backgroundPosition = `-${originalCol * tileSize}px -${originalRow * tileSize}px`;
            
            // 去除所有方块的白边，合为一整张图
            const allTiles = document.querySelectorAll('.tile');
            allTiles.forEach(t => t.style.border = 'none');
        }
    }

    // 启动游戏
    function startGame() {
        isWon = false;
        document.getElementById('victoryMsg').style.display = 'none';
        initTiles();
        shuffleTiles();
        renderBoard(false);
    }

    // 页面加载即开始
    startGame();
</script>

</body>
</html>
