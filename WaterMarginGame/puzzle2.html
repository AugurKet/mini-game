<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>破阵试炼：祝家庄盘陀路</title>
    <style>
        /* 定义全局变量，用来存放每次随机抽到的图片 */
        :root {
            --puzzle-bg: none; 
        }

        body { 
            font-family: "Microsoft YaHei", sans-serif; 
            background-color: #f4ecd8; 
            text-align: center; 
            padding: 20px; 
            color: #333; 
            margin: 0;
            /* 整个网页的大背景，如果您 Images2 里有 bg.png 也可以改成 Images2/bg.png */
            background-image: url('images/bg.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
        }

        .container { 
            background: rgba(255, 250, 240, 0.95); 
            border: 4px solid #5c3a21; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 450px; 
            margin: 0 auto; 
            padding: 20px; 
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6); 
        }

        h1 { color: #8b0000; font-size: 24px; margin-bottom: 10px; border-bottom: 2px dashed #b89f7d; padding-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        p.desc { font-size: 15px; color: #555; margin-bottom: 20px; font-weight: bold; }

        /* 拼图外框 */
        .puzzle-board {
            width: 400px;
            height: 400px;
            margin: 0 auto;
            position: relative;
            border: 4px solid #4a3320;
            background-color: #222; /* 底部黑色 */
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.4);
            perspective: 1000px; /* 开启3D，为最后翻转做准备 */
        }

        /* 拼图的每一个小块 */
        .tile {
            width: 100px;
            height: 100px;
            position: absolute;
            border: 1px solid #e8dcc4;
            box-sizing: border-box;
            background-image: var(--puzzle-bg); /* 读取随机抽到的图 */
            background-size: 400px 400px; /* 强制背景图尺寸和画板一样大 */
            cursor: pointer;
            transition: top 0.2s ease, left 0.2s ease, transform 0.6s ease; /* 滑动动画 */
            transform-style: preserve-3d;
        }

        /* 空白块隐藏背景（呈现底部的黑色） */
        .tile.empty {
            background-image: none !important;
            border: none;
            cursor: default;
        }

        /* 胜利时，第16块的翻转动画 */
        .tile.win-flip {
            background-image: var(--puzzle-bg) !important;
            animation: flipIn 0.8s ease forwards;
        }

        @keyframes flipIn {
            0% { transform: rotateY(-180deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; border: none; }
        }

        .btn { background-color: #8b0000; color: white; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; margin-top: 25px; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .btn:hover { background-color: #5c3a21; transform: translateY(-2px); }

        #victoryMsg { display: none; color: #d4af37; font-size: 24px; font-weight: bold; margin-top: 20px; text-shadow: 1px 1px 2px #000; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>盘陀路阵法</h1>
    <p class="desc">拨开迷雾，复原阵图。找出祝家庄的生门！</p>

    <div class="puzzle-board" id="board">
        </div>

    <div id="victoryMsg">✨ 阵法已破！生门大开！ ✨</div>
    <button class="btn" onclick="startGame()">打乱阵法 (重新排布)</button>
</div>

<audio id="sndSlide" src="correct.mp3"></audio> 

<script>
    // ==========================================
    // 大当家，请在这里填入您 Images2 文件夹里真实的照片名字！
    // ==========================================
    const puzzleImages = [
        "IMG_1693.png",  // 示例：替换成您真实的 .png 名字
        "IMG_1695.png",
        "IMG_1696.png",
        "IMG_1698.png",
        "IMG_1699.png",
        "IMG_1719.png",
        "IMG_1701.png"
    ];

    // 随机抽图魔法
    function pickRandomImage() {
        const randomIndex = Math.floor(Math.random() * puzzleImages.length);
        const selectedImg = puzzleImages[randomIndex];
        // 核心：把路径指向 Images2/，后缀是 .png
        document.documentElement.style.setProperty('--puzzle-bg', `url('Images2/${selectedImg}')`);
    }

    const boardSize = 4; // 4x4 网格
    const tileSize = 100; // 每个方块 100px
    let tiles = []; 
    let isWon = false;

    // 初始化 0-15 的数组 (15 代表第16个空格子)
    function initTiles() {
        tiles = [];
        for (let i = 0; i < boardSize * boardSize; i++) {
            tiles.push(i);
        }
    }

    // 渲染拼图到页面上
    function renderBoard(animate = true) {
        const board = document.getElementById('board');
        board.innerHTML = '';

        for (let i = 0; i < tiles.length; i++) {
            const tileValue = tiles[i]; 
            const tileEl = document.createElement('div');
            tileEl.className = 'tile';
            
            const row = Math.floor(i / boardSize);
            const col = i % boardSize;
            
            tileEl.style.top = (row * tileSize) + 'px';
            tileEl.style.left = (col * tileSize) + 'px';

            if (!animate) tileEl.style.transition = 'none';

            if (tileValue === 15) {
                tileEl.classList.add('empty');
                tileEl.id = 'emptyTile';
            } else {
                const originalRow = Math.floor(tileValue / boardSize);
                const originalCol = tileValue % boardSize;
                tileEl.style.backgroundPosition = `-${originalCol * tileSize}px -${originalRow * tileSize}px`;
            }

            tileEl.onclick = () => handleTileClick(i);
            board.appendChild(tileEl);
        }
    }

    // 处理点击滑动
    function handleTileClick(index) {
        if (isWon) return;

        const emptyIndex = tiles.indexOf(15); 
        const validMoves = getValidMoves(emptyIndex); 

        if (validMoves.includes(index)) {
            [tiles[emptyIndex], tiles[index]] = [tiles[index], tiles[emptyIndex]];
            
            const snd = document.getElementById('sndSlide');
            if(snd) { snd.currentTime = 0; snd.play().catch(e=>{}); }

            renderBoard(true); 
            checkWin();
        }
    }

    // 获取合法移动
    function getValidMoves(emptyIdx) {
        const moves = [];
        const row = Math.floor(emptyIdx / boardSize);
        const col = emptyIdx % boardSize;

        if (row > 0) moves.push(emptyIdx - boardSize); // 上
        if (row < boardSize - 1) moves.push(emptyIdx + boardSize); // 下
        if (col > 0) moves.push(emptyIdx - 1); // 左
        if (col < boardSize - 1) moves.push(emptyIdx + 1); // 右

        return moves;
    }

    // 电脑模拟盲滑 300 步，确保 100% 有解
    function shuffleTiles() {
        for (let i = 0; i < 300; i++) {
            const emptyIndex = tiles.indexOf(15);
            const validMoves = getValidMoves(emptyIndex);
            const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            [tiles[emptyIndex], tiles[randomMove]] = [tiles[randomMove], tiles[emptyIndex]];
        }
    }

    // 检查胜利
    function checkWin() {
        let won = true;
        for (let i = 0; i < tiles.length; i++) {
            if (tiles[i] !== i) { won = false; break; }
        }

        if (won) {
            isWon = true;
            document.getElementById('victoryMsg').style.display = 'block';
            
            // 第16块翻转现出原图
            const emptyTile = document.getElementById('emptyTile');
            emptyTile.classList.remove('empty');
            emptyTile.classList.add('win-flip');
            
            const originalRow = Math.floor(15 / boardSize);
            const originalCol = 15 % boardSize;
            emptyTile.style.backgroundPosition = `-${originalCol * tileSize}px -${originalRow * tileSize}px`;
            
            // 去除分割线
            const allTiles = document.querySelectorAll('.tile');
            allTiles.forEach(t => t.style.border = 'none');
        }
    }

    // 启动游戏
    function startGame() {
        isWon = false;
        document.getElementById('victoryMsg').style.display = 'none';
        
        pickRandomImage(); // 开局先抽一张新图
        initTiles();
        shuffleTiles();
        renderBoard(false);
    }

    startGame();
</script>

</body>
</html>
