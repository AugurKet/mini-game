            gameState = JSON.parse(saved);
            if (gameState.level1Cleared === undefined) gameState.level1Cleared = false;
            if (gameState.artStyle === undefined) gameState.artStyle = 'ai';
        }
        updateArtStyleUI();
        updateUI();
        initGallery();
    }

    function resetGame() {
        if (confirm("确定要清空所有声望和图鉴，重新开始吗？")) {
            localStorage.removeItem('water_margin_save'); location.reload();
        }
    }

    function toggleArtStyle() {
        gameState.artStyle = (gameState.artStyle === 'ai') ? 'classic' : 'ai';
        saveGame();
        updateArtStyleUI();
        initGallery(); 
        
        if (currentDrawnHeroId) {
            const hero = heroes.find(h => h.id === currentDrawnHeroId);
            const folder = gameState.artStyle === 'ai' ? 'images/' : 'image/';
            document.getElementById("cardImage").src = folder + hero.img;
        }
    }

    function updateArtStyleUI() {
        const btn = document.getElementById("artStyleBtn");
        if (gameState.artStyle === 'ai') {
            btn.innerText = "🎨 画风：AI 重制版";
        } else {
            btn.innerText = "🎨 画风：88年 经典版";
        }
    }

    function updateUI() {
        document.getElementById("repValue").innerText = gameState.reputation;
        document.getElementById("collectedCount").innerText = gameState.collectedIds.length;
    }

    function initGallery() {
        const grid = document.getElementById("galleryGrid");
        grid.innerHTML = "";
        
        const folder = gameState.artStyle === 'ai' ? 'images/' : 'image/';
        
        heroes.forEach(h => {
            const isUnlocked = gameState.collectedIds.includes(h.id);
            const item = document.createElement("div");
            item.className = "gallery-item" + (isUnlocked ? " unlocked" : "");
            item.id = "gallery-" + h.id;
            
            item.innerHTML = `
                <div class="img-box">
                    <img class="pixel-art" src="${folder}${h.img}" alt="${h.name}">
                </div>
                <div class="info-box">
                    <span class="nickname">${h.nickname}</span>
                    <span class="name">${h.name}</span>
                </div>
            `;
            grid.appendChild(item);
        });
    }

    function drawCard() {
        if (gameState.reputation < 10) { alert("大当家，声望不足，请先去文汇阁赚取！"); return; }
        gameState.reputation -= 10;
        
        const hero = heroes[Math.floor(Math.random() * heroes.length)];
        currentDrawnHeroId = hero.id; 
        
        const imgEl = document.getElementById("cardImage");
        const txtEl = document.getElementById("cardText");
        
        const folder = gameState.artStyle === 'ai' ? 'images/' : 'image/';
        imgEl.src = folder + hero.img; 
        imgEl.style.display = "block";
        txtEl.style.display = "none";

        if (!gameState.collectedIds.includes(hero.id)) {
            gameState.collectedIds.push(hero.id);
            const galleryItem = document.getElementById("gallery-" + hero.id);
            if (galleryItem) galleryItem.classList.add("unlocked");
        }
        
        if (gameState.collectedIds.length === heroes.length && !gameState.level1Cleared) {
            gameState.level1Cleared = true; saveGame();
            setTimeout(() => {
                soundCorrect.currentTime = 0; soundCorrect.play(); 
                document.getElementById("victoryModal").style.display = "flex";
            }, 800);
        }
        
        saveGame(); updateUI();
    }

    function loadQuestion() {
        currentQ = questions[Math.floor(Math.random() * questions.length)];
        document.getElementById("feedback").innerText = "";
        document.getElementById("questionBox").innerText = currentQ.question;
        const box = document.getElementById("optionsBox");
        box.innerHTML = "";
        currentQ.options.forEach((opt, idx) => {
            const b = document.createElement("button");
            b.className = "option-btn"; b.innerText = opt;
            b.onclick = () => {
                if (idx === currentQ.correctIndex) {
                    soundCorrect.currentTime = 0; soundCorrect.play(); 
                    document.getElementById("feedback").style.color = "green";
                    document.getElementById("feedback").innerText = currentQ.explanation;
                    gameState.reputation += currentQ.reward;
                    saveGame(); updateUI();
                } else {
                    soundWrong.currentTime = 0; soundWrong.play(); 
                    document.getElementById("feedback").style.color = "red";
                    document.getElementById("feedback").innerText = "抉择失误，再思量思量。声望无变动。";
                }
                box.innerHTML = "";
            };
            box.appendChild(b);
        });
    }

    function startNextLevel() {
        document.getElementById("victoryModal").style.display = "none";
        alert("敬请期待！系统正在紧锣密鼓地开发【第二关：三打祝家庄】的军营驻地功能！\n（大当家，咱们什么时候开始规划第二关的面板？）");
    }

    loadGame();
</script>

</body>
</html>
