<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水浒：天命图鉴 v0.5 (36天罡完整版)</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f4ecd8; text-align: center; padding: 20px; }
        .wrapper { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 320px; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        .gallery-container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 80%; max-width: 800px; margin: 0 auto; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        h1 { color: #8b0000; font-size: 24px; margin-bottom: 20px; border-bottom: 2px dashed #b89f7d; padding-bottom: 10px; }
        
        .pixel-art { image-rendering: pixelated; image-rendering: crisp-edges; }

        .card-display { width: 150px; height: 150px; border: 4px solid #b89f7d; margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #e8dcc4; overflow: hidden; }
        .card-display img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .card-display span { font-size: 20px; font-weight: bold; color: #555; }
        
        .btn { background-color: #8b0000; color: white; border: none; padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; margin: 5px; }
        .btn:hover { background-color: #a52a2a; }
        .stats { margin-bottom: 20px; font-size: 18px; color: #333; font-weight: bold; background: #e8dcc4; padding: 10px; border-radius: 5px; display: inline-block; }
        
        .question-box { background: #e8dcc4; padding: 15px; border-radius: 5px; margin-bottom: 15px; text-align: left; font-size: 16px; min-height: 60px; }
        .option-btn { display: block; width: 100%; background-color: #5c3a21; color: white; border: none; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 5px; margin-bottom: 10px; transition: 0.3s; text-align: left; }
        .option-btn:hover { background-color: #8b0000; }
        #feedback { font-weight: bold; margin-top: 10px; min-height: 20px; color: #8b0000; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 20px; }
        .gallery-item { width: 80px; height: 80px; background-color: #ccc; border: 2px solid #777; display: flex; align-items: center; justify-content: center; border-radius: 5px; overflow: hidden; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: contain; opacity: 0.2; }
        .gallery-item.unlocked img { opacity: 1; }
        .gallery-item.unlocked { border-color: #ffb800; background-color: #ffe4b5; }
    </style>
</head>
<body>

<div class="stats">当前山寨声望：<span id="repValue">50</span></div>

<div class="wrapper">
    <div class="container">
        <h1>聚义厅</h1>
        <div id="cardDisplay" class="card-display">
            <img id="cardImage" class="pixel-art" src="" alt="头像">
            <span id="cardText">等待招募...</span>
        </div>
        <button class="btn" onclick="drawCard()">招募好汉 (消耗10声望)</button>
    </div>

    <div class="container">
        <h1>文汇阁</h1>
        <div id="questionBox" class="question-box">点击下方按钮获取江湖案卷</div>
        <div id="optionsBox"></div>
        <div id="feedback"></div>
        <button class="btn" onclick="loadQuestion()" style="width: 100%; background-color: #2e8b57;">翻阅案卷 (赚声望)</button>
    </div>
</div>

<div class="gallery-container">
    <h1>梁山图鉴 (<span id="collectedCount">0</span>/36)</h1>
    <div id="galleryGrid" class="gallery-grid"></div>
</div>

<script>
    let reputation = 50;
    
    // 完整的 36 天罡数组，确保语法严丝合缝
    const heroes = [
        { id: "h1", name: "宋江", rarity: "SSR", image: "images/songjiang.jpg" },
        { id: "h2", name: "卢俊义", rarity: "SSR", image: "images/lujunyi.jpg" },
        { id: "h3", name: "吴用", rarity: "SSR", image: "images/wuyong.jpg" },
        { id: "h4", name: "公孙胜", rarity: "SSR", image: "images/gongsunsheng.jpg" },
        { id: "h5", name: "关胜", rarity: "SSR", image: "images/guansheng.jpg" },
        { id: "h6", name: "林冲", rarity: "SSR", image: "images/linchong.jpg" },
        { id: "h7", name: "秦明", rarity: "SR", image: "images/qinming.jpg" },
        { id: "h8", name: "呼延灼", rarity: "SR", image: "images/huyanzhuo.jpg" },
        { id: "h9", name: "花荣", rarity: "SR", image: "images/huarong.jpg" },
        { id: "h10", name: "柴进", rarity: "SR", image: "images/chaijin.jpg" },
        { id: "h11", name: "李应", rarity: "SR", image: "images/liying.jpg" },
        { id: "h12", name: "朱仝", rarity: "SR", image: "images/zhutong.jpg" },
        { id: "h13", name: "鲁智深", rarity: "SSR", image: "images/luzhishen.jpg" },
        { id: "h14", name: "武松", rarity: "SSR", image: "images/wusong.jpg" },
        { id: "h15", name: "董平", rarity: "SR", image: "images/dongping.jpg" },
        { id: "h16", name: "张清", rarity: "SR", image: "images/zhangqing.jpg" },
        { id: "h17", name: "杨志", rarity: "SR", image: "images/yangzhi.jpg" },
        { id: "h18", name: "徐宁", rarity: "SR", image: "images/xuning.jpg" },
        { id: "h19", name: "索超", rarity: "SR", image: "images/suochao.jpg" },
        { id: "h20", name: "戴宗", rarity: "SR", image: "images/dai_zong.jpg" },
        { id: "h21", name: "刘唐", rarity: "SR", image: "images/liutang.jpg" },
        { id: "h22", name: "李逵", rarity: "SSR", image: "images/likui.jpg" },
        { id: "h23", name: "史进", rarity: "SR", image: "images/shijin.jpg" },
        { id: "h24", name: "穆弘", rarity: "SR", image: "images/muhong.jpg" },
        { id: "h25", name: "雷横", rarity: "SR", image: "images/leiheng.jpg" },
        { id: "h26", name: "李俊", rarity: "SR", image: "images/lijun.jpg" },
        { id: "h27", name: "阮小二", rarity: "SR", image: "images/ruanxiaoer.jpg" },
        { id: "h28", name: "张横", rarity: "SR", image: "images/zhangheng.jpg" },
        { id: "h29", name: "阮小五", rarity: "SR", image: "images/ruanxiaowu.jpg" },
        { id: "h30", name: "张顺", rarity: "SR", image: "images/zhangshun.jpg" },
        { id: "h31", name: "阮小七", rarity: "SR", image: "images/ruanxiaoqi.jpg" },
        { id: "h32", name: "杨雄", rarity: "SR", image: "images/yangxiong.jpg" },
        { id: "h33", name: "石秀", rarity: "SR", image: "images/shixiu.jpg" },
        { id: "h34", name: "解珍", rarity: "SR", image: "images/xiezhen.jpg" },
        { id: "h35", name: "解宝", rarity: "SR", image: "images/xiebao.jpg" },
        { id: "h36", name: "燕青", rarity: "SSR", image: "images/yanqing.jpg" }
    ];

    let collectedHeroes = [];

    const questions = [
           // --- 财富与风险规划篇 (Scenario) ---
        { type: "scenario", question: "生辰纲将途经高海拔雪山，你的规划是？", options: ["咬牙硬挺", "提前规划风险对冲与保障"], correctIndex: 1, reward: 20, explanation: "极佳决策！做好高海拔意外与医疗的保障规划才是长远之计。获得 20 声望！" },
        { type: "scenario", question: "山寨库银日益增多，单纯存放在地窖容易发霉贬值。大当家决定如何打理这笔公款？", options: ["全部换成真金白银埋入深山", "招募懂行的账房进行系统的财富规划与分散投资", "今朝有酒今朝醉，全部分发给喽啰"], correctIndex: 1, reward: 25, explanation: "深谋远虑！引入专业的财富规划，方能确保山寨基业长青。获得 25 声望！" },
        { type: "scenario", question: "有兄弟提出，每次下山执行高危任务，家眷无人照料。你决定怎么做？", options: ["设立‘山寨抚恤互助金’，通过制度转移风险", "生死有命，各安天道", "只给头领家属发安家费"], correctIndex: 0, reward: 20, explanation: "大格局！建立类似于现代保险的互助基金，能极大安抚人心。获得 20 声望！" },

        // --- 耐力与长征篇 (Scenario/Trivia) ---
        { type: "scenario", question: "神行太保戴宗要选拔一批兄弟组建‘长跑营’，要求能连续奔袭百里（超级马拉松）。选拔时你最看重什么品质？", options: ["瞬间的爆发力", "百里挑一的极强耐力与科学补给策略", "体型必须庞大魁梧"], correctIndex: 1, reward: 20, explanation: "内行！超长距离奔袭靠的是耐力底子和科学补给，而非蛮力。获得 20 声望！" },
        { type: "trivia", question: "戴宗的‘神行法’日行八百里，他在腿上通常要绑几个甲马？", options: ["两个", "四个", "六个", "八个"], correctIndex: 1, reward: 15, explanation: "正确！戴宗作法时，腿上绑四个甲马便能日行八百里。获得 15 声望！" },

        // --- 统筹与聚会篇 (Scenario) ---
        { type: "scenario", question: "明年五月，山寨准备举办一场盛大的‘群英返山大会’（Homecoming Day）。为了让老兄弟们都有归属感并留下纪念，你派谁去主理筹备并设计海报？", options: ["黑旋风李逵", "浪子燕青与玉臂匠金大坚", "急先锋索超"], correctIndex: 1, reward: 20, explanation: "知人善任！燕青懂交际，金大坚懂刻字设计，筹备大会再合适不过。获得 20 声望！" },
        { type: "scenario", question: "在聚会大合影时，大当家觉得某位兄弟的画像画得太胖了。作为主事者，你应当？", options: ["痛打画师三十大板", "要求画师重新修改，将身形调整至精干瘦削的状态", "凑合着看吧"], correctIndex: 1, reward: 15, explanation: "注重细节！呈现出精干的状态更能彰显山寨的精神面貌。获得 15 声望！" },

        // --- 科技与载具篇 (Scenario) ---
        { type: "scenario", question: "山寨缴获了几辆西夏国最新打造的‘神行车’（采用高新动力技术）。谁最适合去研究这些新载具的运作与充能？", options: ["轰天雷凌振", "赤发鬼刘唐", "花和尚鲁智深"], correctIndex: 0, reward: 20, explanation: "正解！凌振是山寨里首屈一指的火炮与机械技术专家。获得 20 声望！" },

        // --- 经典文学常识篇 (Trivia) ---
        { type: "trivia", question: "《水浒传》中，‘景阳冈打虎’的是哪位好汉？", options: ["林冲", "鲁智深", "武松", "李逵"], correctIndex: 2, reward: 10, explanation: "经典送分题！武二郎景阳冈打虎名扬天下。获得 10 声望！" },
        { type: "trivia", question: "鲁智深拳打镇关西时，是以什么借口消遣郑屠的？", options: ["嫌弃肉不新鲜", "要切十斤精肉、十斤肥肉、十斤寸金软骨，且都要剁成臊子", "怪郑屠态度不好", "嫌肉卖得太贵"], correctIndex: 1, reward: 15, explanation: "这等切肉法，摆明了是来找茬的。获得 15 声望！" },
        { type: "trivia", question: "梁山泊排座次后，谁担任了‘掌管机密军师’一职？", options: ["吴用", "公孙胜", "朱武", "萧让"], correctIndex: 0, reward: 10, explanation: "智多星吴用，梁山第一军师。获得 10 声望！" },
        { type: "trivia", question: "‘倒拔垂杨柳’展现了哪位好汉的惊人膂力？", options: ["武松", "李逵", "卢俊义", "鲁智深"], correctIndex: 3, reward: 10, explanation: "花和尚鲁智深，力大无穷。获得 10 声望！" },
        { type: "trivia", question: "宋江在浔阳楼题的反诗中，有一句是‘他年若得报冤仇’，下一句是？", options: ["敢笑黄巢不丈夫", "血染浔阳江口", "定让贪官尽低头", "替天行道显威风"], correctIndex: 1, reward: 20, explanation: "正确！原诗为：他年若得报冤仇，血染浔阳江口。获得 20 声望！" }    
        { type: "trivia", question: "‘朴’字的正确读音是？", options: ["guó", "pǔ", "pō", "piáo"], correctIndex: 1, reward: 15, explanation: "正确！念 pǔ。获得 15 声望！" },
        { type: "scenario", question: "生辰纲将途经高海拔雪山，你的规划是？", options: ["咬牙硬挺", "提前规划风险对冲与保障"], correctIndex: 1, reward: 20, explanation: "极佳决策！做好保障规划才是长远之计。获得 20 声望！" }
    ];

    function initGallery() {
        const grid = document.getElementById("galleryGrid");
        grid.innerHTML = "";
        heroes.forEach(hero => {
            const item = document.createElement("div");
            item.className = "gallery-item";
            item.id = "gallery-" + hero.id;
            item.innerHTML = `<img class="pixel-art" src="${hero.image}" alt="${hero.name}" onerror="this.src='https://via.placeholder.com/80/cccccc/000000?text=缺图'">`;
            grid.appendChild(item);
        });
    }

    function updateReputationDisplay() { document.getElementById("repValue").innerText = reputation; }

    function drawCard() {
        if (reputation < 10) { alert("大当家，声望不足！"); return; }
        reputation -= 10; updateReputationDisplay();

        const randomIndex = Math.floor(Math.random() * heroes.length);
        const drawnHero = heroes[randomIndex];
        
        const imgElement = document.getElementById("cardImage");
        const textElement = document.getElementById("cardText");
        
        // 增加错误处理，如果图片没找到不至于裂开
        imgElement.onerror = function() { this.src = 'https://via.placeholder.com/150/cccccc/000000?text=缺图'; };
        imgElement.src = drawnHero.image;
        imgElement.style.display = "block";
        textElement.style.display = "none";

        if (!collectedHeroes.includes(drawnHero.id)) {
            collectedHeroes.push(drawnHero.id);
            document.getElementById("collectedCount").innerText = collectedHeroes.length;
            const galleryItem = document.getElementById("gallery-" + drawnHero.id);
            if(galleryItem) galleryItem.classList.add("unlocked");
        }
    }

    let currentQuestion = null;
    function loadQuestion() {
        const randomIndex = Math.floor(Math.random() * questions.length);
        currentQuestion = questions[randomIndex];
        document.getElementById("feedback").innerText = "";
        document.getElementById("questionBox").innerText = currentQuestion.question;
        const optionsBox = document.getElementById("optionsBox");
        optionsBox.innerHTML = "";
        for (let i = 0; i < currentQuestion.options.length; i++) {
            const btn = document.createElement("button");
            btn.className = "option-btn"; btn.innerText = currentQuestion.options[i];
            btn.onclick = function() { checkAnswer(i); };
            optionsBox.appendChild(btn);
        }
    }
    function checkAnswer(selectedIndex) {
        const feedback = document.getElementById("feedback");
        if (selectedIndex === currentQuestion.correctIndex) {
            feedback.style.color = "green"; feedback.innerText = currentQuestion.explanation;
            reputation += currentQuestion.reward; updateReputationDisplay();
        } else {
            feedback.style.color = "red"; feedback.innerText = "抉择失误！";
        }
        document.getElementById("optionsBox").innerHTML = "";
    }

    // 启动引擎
    initGallery();
</script>

</body>
</html>
