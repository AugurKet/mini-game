<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水浒：天命图鉴 v0.1</title>
    <style>
        /* 这里的 CSS 是用来给页面做简单的复古“装修”的 */
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f4ecd8; text-align: center; padding: 50px; }
        .container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 300px; margin: 0 auto; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        h1 { color: #8b0000; font-size: 24px; margin-bottom: 20px; }
        .card-display { width: 150px; height: 150px; border: 2px dashed #b89f7d; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #555; background: #e8dcc4; text-align: center; line-height: 1.5; }
        .btn { background-color: #8b0000; color: white; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background-color: #a52a2a; }
        .stats { margin-top: 20px; font-size: 14px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>聚义厅</h1>
    <div id="cardDisplay" class="card-display">等待招募...</div>
    <button class="btn" onclick="drawCard()">招募好汉 (消耗10声望)</button>
    <div class="stats">
        <p>当前声望：<span id="repValue">100</span></p>
    </div>
</div>

<script>
    // 这里的 JavaScript 是游戏的底层逻辑，目前放了一个极简版的武将数据库
    const heroes = [
        { name: "宋江", rarity: "SSR" },
        { name: "林冲", rarity: "SSR" },
        { name: "朱武", rarity: "SR" },
        { name: "时迁", rarity: "R" },
        { name: "王英", rarity: "R" }
    ];

    let reputation = 100; // 玩家初始声望

    // 抽卡核心功能
    function drawCard() {
        if (reputation < 10) {
            alert("大当家，声望不足！请先去赚取声望。");
            return;
        }

        // 扣除声望并更新显示
        reputation -= 10;
        document.getElementById("repValue").innerText = reputation;

        // 简单的随机抽卡逻辑
        const randomIndex = Math.floor(Math.random() * heroes.length);
        const drawnHero = heroes[randomIndex];

        // 显示抽卡结果
        const display = document.getElementById("cardDisplay");
        display.innerText = drawnHero.name + "\n(" + drawnHero.rarity + ")";

        // 根据稀有度改变字体和边框颜色
        if (drawnHero.rarity === "SSR") {
            display.style.color = "#ff4500"; // 橙红色
            display.style.border = "3px solid #ff4500";
        } else if (drawnHero.rarity === "SR") {
            display.style.color = "#8a2be2"; // 紫色
            display.style.border = "3px solid #8a2be2";
        } else {
            display.style.color = "#333"; // 黑色
            display.style.border = "2px solid #333";
        }
    }
</script>

</body>
</html>
