<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水浒：天命图鉴 v0.5 - 存档版</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f4ecd8; text-align: center; padding: 20px; color: #333; }
        .wrapper { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 320px; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        .gallery-container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 90%; max-width: 900px; margin: 0 auto; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        h1 { color: #8b0000; font-size: 24px; margin-bottom: 20px; border-bottom: 2px dashed #b89f7d; padding-bottom: 10px; }
        
        .pixel-art { image-rendering: pixelated; image-rendering: crisp-edges; }
        .card-display { width: 150px; height: 150px; border: 4px solid #b89f7d; margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #e8dcc4; overflow: hidden; }
        .card-display img { width: 100%; height: 100%; object-fit: contain; display: none; }
        
        .btn { background-color: #8b0000; color: white; border: none; padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; margin: 5px; }
        .btn:hover { background-color: #a52a2a; }
        .stats-bar { margin-bottom: 20px; font-size: 18px; font-weight: bold; background: #8b0000; color: #fff; padding: 10px 20px; border-radius: 50px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        .question-box { background: #e8dcc4; padding: 15px; border-radius: 5px; margin-bottom: 15px; text-align: left; font-size: 16px; min-height: 60px; line-height: 1.4; }
        .option-btn { display: block; width: 100%; background-color: #5c3a21; color: white; border: none; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 5px; margin-bottom: 10px; text-align: left; }
        .option-btn:hover { background-color: #8b0000; }
        #feedback { font-weight: bold; margin-top: 10px; min-height: 20px; color: #8b0000; font-size: 14px; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin-top: 20px; }
        .gallery-item { width: 70px; height: 70px; background-color: #ccc; border: 2px solid #777; border-radius: 5px; overflow: hidden; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: contain; opacity: 0.15; filter: grayscale(100%); }
        .gallery-item.unlocked img { opacity: 1; filter: grayscale(0%); }
        .gallery-item.unlocked { border-color: #ffb800; background-color: #ffe4b5; box-shadow: 0 0 10px rgba(255,184,0,0.5); }
        
        .reset-btn { margin-top: 40px; font-size: 12px; color: #999; text-decoration: underline; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>

<div class="stats-bar">当前山寨声望：<span id="repValue">0</span></div>

<div class="wrapper">
    <div class="container">
        <h1>聚义厅</h1>
        <div id="cardDisplay" class="card-display">
            <img id="cardImage" class="pixel-art" src="" alt="头像">
            <span id="cardText" style="color:#555">等待招募...</span>
        </div>
        <button class="btn" onclick="drawCard()">招募好汉 (消耗10)</button>
    </div>

    <div class="container">
        <h1>文汇阁</h1>
        <div id="questionBox" class="question-box">点击下方翻阅案卷</div>
        <div id="optionsBox"></div>
        <div id="feedback"></div>
        <button class="btn" onclick="loadQuestion()" style="width: 100%; background-color: #2e8b57;">翻阅案卷 (赚声望)</button>
    </div>
</div>

<div class="gallery-container">
    <h1>梁山图鉴 (<span id="collectedCount">0</span>/36)</h1>
    <div id="galleryGrid" class="gallery-grid"></div>
</div>

<button class="reset-btn" onclick="resetGame()">[ 重新开局 / 清空存档 ]</button>

<script>
    // --- 1. 核心数据 (图片命名已优化：无下划线) ---
    const heroes = [
        { id: "h1", name: "宋江", rarity: "SSR", img: "songjiang.jpg" },
        { id: "h2", name: "卢俊义", rarity: "SSR", img: "lujunyi.jpg" },
        { id: "h3", name: "吴用", rarity: "SSR", img: "wuyong.jpg" },
        { id: "h4", name: "公孙胜", rarity: "SSR", img: "gongsunsheng.jpg" },
        { id: "h5", name: "关胜", rarity: "SSR", img: "guansheng.jpg" },
        { id: "h6", name: "林冲", rarity: "SSR", img: "linchong.jpg" },
        { id: "h7", name: "秦明", rarity: "SR", img: "qinming.jpg" },
        { id: "h8", name: "呼延灼", rarity: "SR", img: "huyanzhuo.jpg" },
        { id: "h9", name: "花荣", rarity: "SR", img: "huarong.jpg" },
        { id: "h10", name: "柴进", rarity: "SR", img: "chaijin.jpg" },
        { id: "h11", name: "李应", rarity: "SR", img: "liying.jpg" },
        { id: "h12", name: "朱仝", rarity: "SR", img: "zhutong.jpg" },
        { id: "h13", name: "鲁智深", rarity: "SSR", img: "luzhishen.jpg" },
        { id: "h14", name: "武松", rarity: "SSR", img: "wusong.jpg" },
        { id: "h15", name: "董平", rarity: "SR", img: "dongping.jpg" },
        { id: "h16", name: "张清", rarity: "SR", img: "zhangqing.jpg" },
        { id: "h17", name: "杨志", rarity: "SR", img: "yangzhi.jpg" },
        { id: "h18", name: "徐宁", rarity: "SR", img: "xuning.jpg" },
        { id: "h19", name: "索超", rarity: "SR", img: "suochao.jpg" },
        { id: "h20", name: "戴宗", rarity: "SR", img: "daizong.jpg" },
        { id: "h21", name: "刘唐", rarity: "SR", img: "liutang.jpg" },
        { id: "h22", name: "李逵", rarity: "SSR", img: "likui.jpg" },
        { id: "h23", name: "史进", rarity: "SR", img: "shijin.jpg" },
        { id: "h24", name: "穆弘", rarity: "SR", img: "muhong.jpg" },
        { id: "h25", name: "雷横", rarity: "SR", img: "leiheng.jpg" },
        { id: "h26", name: "李俊", rarity: "SR", img: "lijun.jpg" },
        { id: "h27", name: "阮小二", rarity: "SR", img: "ruanxiaoer.jpg" },
        { id: "h28", name: "张横", rarity: "SR", img: "zhangheng.jpg" },
        { id: "h29", name: "阮小五", rarity: "SR", img: "ruanxiaowu.jpg" },
        { id: "h30", name: "张顺", rarity: "SR", img: "zhangshun.jpg" },
        { id: "h31", name: "阮小七", rarity: "SR", img: "ruanxiaoqi.jpg" },
        { id: "h32", name: "杨雄", rarity: "SR", img: "yangxiong.jpg" },
        { id: "h33", name: "石秀", rarity: "SR", img: "shixiu.jpg" },
        { id: "h34", name: "解珍", rarity: "SR", img: "xiezhen.jpg" },
        { id: "h35", name: "解宝", rarity: "SR", img: "xiebao.jpg" },
        { id: "h36", name: "燕青", rarity: "SSR", img: "yanqing.jpg" }
    ];

    const questions = [
        { type: "scenario", question: "生辰纲将途经高海拔雪山，你的规划是？", options: ["咬牙硬挺", "提前规划风险对冲与保障"], correctIndex: 1, reward: 20, explanation: "极佳决策！做好保障规划才是长远之计。获得 20 声望！" },
        { type: "scenario", question: "山寨库银日益增多，单纯存放在地窖容易发霉贬值。大当家决定如何打理这笔公款？", options: ["全部换成真金白银埋入深山", "招募懂行的账房进行财富规划与分散投资", "今朝有酒今朝醉"], correctIndex: 1, reward: 25, explanation: "深谋远虑！引入专业规划，方能基业长青。获得 25 声望！" },
        { type: "scenario", question: "有兄弟提出执行高危任务家眷无人照料。你决定？", options: ["设立‘山寨抚恤互助金’", "生死有命", "只发给头领"], correctIndex: 0, reward: 20, explanation: "大格局！建立类似于现代保险的互助基金，极安人心。获得 20 声望！" },
        { type: "scenario", question: "戴宗组建‘长跑营’选拔人才，你最看重？", options: ["爆发力", "耐力与科学补给策略", "体型庞大"], correctIndex: 1, reward: 20, explanation: "内行！超长奔袭靠的是耐力和补给。获得 20 声望！" },
        { type: "trivia", question: "戴宗的‘神行法’日行八百里，腿上绑几个甲马？", options: ["两个", "四个", "六个", "八个"], correctIndex: 1, reward: 15, explanation: "正确！绑四个甲马便能日行八百里。获得 15 声望！" },
        { type: "scenario", question: "筹备‘群英返山大会’并设计海报，派谁主理？", options: ["李逵", "燕青与金大坚", "索超"], correctIndex: 1, reward: 20, explanation: "知人善任！燕青懂交际，金大坚懂设计。获得 20 声望！" },
        { type: "scenario", question: "合影画像被画胖了，主事者应当？", options: ["打画师大板", "要求修改至精干瘦削", "凑合看"], correctIndex: 1, reward: 15, explanation: "注重细节！彰显山寨精神面貌。获得 15 声望！" },
        { type: "scenario", question: "研究西夏‘神行车’（高新动力），谁最适合？", options: ["凌振", "刘唐", "鲁智深"], correctIndex: 0, reward: 20, explanation: "正解！凌振是机械专家。获得 20 声望！" },
        { type: "trivia", question: "景阳冈打虎的是哪位？", options: ["林冲", "鲁智深", "武松", "李逵"], correctIndex: 2, reward: 10, explanation: "送分题！武二郎名扬天下。获得 10 声望！" },
        { type: "trivia", question: "宋江浔阳楼反诗下一句是？", options: ["敢笑黄巢不丈夫", "血染浔阳江口", "定让贪官低头"], correctIndex: 1, reward: 20, explanation: "正确！血染浔阳江口。获得 20 声望！" },
        { type: "trivia", question: "‘朴’字的正确读音是？", options: ["guó", "pǔ", "pō"], correctIndex: 1, reward: 15, explanation: "正确！念 pǔ。获得 15 声望！" }
    ];

    // --- 2. 存档系统逻辑 ---
    let gameState = {
        reputation: 50,
        collectedIds: []
    };

    function saveGame() {
        localStorage.setItem('water_margin_save', JSON.stringify(gameState));
    }

    function loadGame() {
        const saved = localStorage.getItem('water_margin_save');
        if (saved) {
            gameState = JSON.parse(saved);
        }
        updateUI();
        initGallery();
    }

    function resetGame() {
        if (confirm("确定要清空所有声望和图鉴，重新开始吗？")) {
            localStorage.removeItem('water_margin_save');
            location.reload();
        }
    }

    // --- 3. 游戏核心逻辑 ---
    function updateUI() {
        document.getElementById("repValue").innerText = gameState.reputation;
        document.getElementById("collectedCount").innerText = gameState.collectedIds.length;
    }

    function initGallery() {
        const grid = document.getElementById("galleryGrid");
        grid.innerHTML = "";
        heroes.forEach(h => {
            const item = document.createElement("div");
            item.className = "gallery-item" + (gameState.collectedIds.includes(h.id) ? " unlocked" : "");
            item.id = "gallery-" + h.id;
            item.innerHTML = `<img class="pixel-art" src="images/${h.img}" alt="${h.name}">`;
            grid.appendChild(item);
        });
    }

    function drawCard() {
        if (gameState.reputation < 10) { alert("声望不足！"); return; }
        gameState.reputation -= 10;
        
        const hero = heroes[Math.floor(Math.random() * heroes.length)];
        const imgEl = document.getElementById("cardImage");
        const txtEl = document.getElementById("cardText");
        
        imgEl.src = "images/" + hero.img;
        imgEl.style.display = "block";
        txtEl.style.display = "none";

        if (!gameState.collectedIds.includes(hero.id)) {
            gameState.collectedIds.push(hero.id);
            const galleryItem = document.getElementById("gallery-" + hero.id);
            if (galleryItem) galleryItem.classList.add("unlocked");
        }
        
        saveGame();
        updateUI();
    }

    let currentQ = null;
    function loadQuestion() {
        currentQ = questions[Math.floor(Math.random() * questions.length)];
        document.getElementById("feedback").innerText = "";
        document.getElementById("questionBox").innerText = currentQ.question;
        const box = document.getElementById("optionsBox");
        box.innerHTML = "";
        currentQ.options.forEach((opt, idx) => {
            const b = document.createElement("button");
            b.className = "option-btn";
            b.innerText = opt;
            b.onclick = () => {
                if (idx === currentQ.correctIndex) {
                    document.getElementById("feedback").style.color = "green";
                    document.getElementById("feedback").innerText = currentQ.explanation;
                    gameState.reputation += currentQ.reward;
                    saveGame();
                    updateUI();
                } else {
                    document.getElementById("feedback").style.color = "red";
                    document.getElementById("feedback").innerText = "抉择失误，再思量思量。";
                }
                box.innerHTML = "";
            };
            box.appendChild(b);
        });
    }

    // 初始化加载
    loadGame();
</script>

</body>
</html>
