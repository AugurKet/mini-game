<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水浒：天命图鉴 v0.4.1 (JPG 支持版)</title>
    <style>
        /* 复古风格 CSS */
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f4ecd8; text-align: center; padding: 20px; }
        .wrapper { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 320px; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        .gallery-container { border: 4px solid #5c3a21; border-radius: 10px; background: #fffaf0; width: 80%; max-width: 800px; margin: 0 auto; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        h1 { color: #8b0000; font-size: 24px; margin-bottom: 20px; border-bottom: 2px dashed #b89f7d; padding-bottom: 10px; }
        
        /* 关键 CSS：让像素画保持清晰不模糊 */
        .pixel-art { image-rendering: pixelated; image-rendering: crisp-edges; }

        .card-display { width: 150px; height: 150px; border: 4px solid #b89f7d; margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #e8dcc4; overflow: hidden; }
        .card-display img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .card-display span { font-size: 20px; font-weight: bold; color: #555; }
        
        .btn { background-color: #8b0000; color: white; border: none; padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; margin: 5px; }
        .btn:hover { background-color: #a52a2a; }
        .stats { margin-bottom: 20px; font-size: 18px; color: #333; font-weight: bold; background: #e8dcc4; padding: 10px; border-radius: 5px; display: inline-block; }
        
        .question-box { background: #e8dcc4; padding: 15px; border-radius: 5px; margin-bottom: 15px; text-align: left; font-size: 16px; min-height: 60px; }
        .option-btn { display: block; width: 100%; background-color: #5c3a21; color: white; border: none; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 5px; margin-bottom: 10px; transition: 0.3s; text-align: left; }
        .option-btn:hover { background-color: #8b0000; }
        #feedback { font-weight: bold; margin-top: 10px; min-height: 20px; color: #8b0000; }

        /* 图鉴网格样式 */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 20px; }
        .gallery-item { width: 80px; height: 80px; background-color: #ccc; border: 2px solid #777; display: flex; align-items: center; justify-content: center; border-radius: 5px; overflow: hidden; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: contain; opacity: 0.2; }
        .gallery-item.unlocked img { opacity: 1; }
        .gallery-item.unlocked { border-color: #ffb800; background-color: #ffe4b5; }
    </style>
</head>
<body>

<div class="stats">当前山寨声望：<span id="repValue">50</span></div>

<div class="wrapper">
    <div class="container">
        <h1>聚义厅</h1>
        <div id="cardDisplay" class="card-display">
            <img id="cardImage" class="pixel-art" src="" alt="头像">
            <span id="cardText">等待招募...</span>
        </div>
        <button class="btn" onclick="drawCard()">招募好汉 (消耗10声望)</button>
    </div>

    <div class="container">
        <h1>文汇阁</h1>
        <div id="questionBox" class="question-box">点击下方按钮获取江湖案卷</div>
        <div id="optionsBox"></div>
        <div id="feedback"></div>
        <button class="btn" onclick="loadQuestion()" style="width: 100%; background-color: #2e8b57;">翻阅案卷 (赚声望)</button>
    </div>
</div>

<div class="gallery-container">
    <h1>梁山图鉴 (<span id="collectedCount">0</span>/6)</h1>
    <div id="galleryGrid" class="gallery-grid">
        </div>
</div>

<script>
    let reputation = 50;
    
    // --- 已全部更新为 .jpg 后缀 ---
    const heroes = [
        { id: "h1", name: "宋江", rarity: "SSR", image: "images/songjiang.jpg" },
        { id: "h2", name: "林冲", rarity: "SSR", image: "images/linchong.jpg" },
        { id: "h3", name: "吴用", rarity: "SR", image: "images/wuyong.jpg" }, 
        { id: "h4", name: "卢俊义", rarity: "SSR", image: "images/lujunyi.jpg" }, 
        { id: "h5", name: "公孙胜", rarity: "SR", image: "images/gongsun_sheng.jpg" }, 
        { id: "h6", name: "关胜", rarity: "SR", image: "images/guansheng.jpg" } 
    ];

    let collectedHeroes = [];

    const questions = [
        { type: "trivia", question: "‘朴’字的正确读音是？", options: ["guó", "pǔ", "pō", "piáo"], correctIndex: 1, reward: 15, explanation: "正确！念 pǔ。获得 15 声望！" },
        { type: "scenario", question: "生辰纲将途经高海拔雪山，你的规划是？", options: ["咬牙硬挺", "提前规划风险对冲与保障"], correctIndex: 1, reward: 20, explanation: "极佳决策！做好保障规划才是长远之计。获得 20 声望！" }
    ];

    function initGallery() {
        const grid = document.getElementById("galleryGrid");
        grid.innerHTML = "";
        heroes.forEach(hero => {
            const item = document.createElement("div");
            item.className = "gallery-item";
            item.id = "gallery-" + hero.id;
            item.innerHTML = `<img class="pixel-art" src="${hero.image}" alt="${hero.name}">`;
            grid.appendChild(item);
        });
    }

    function updateReputationDisplay() { document.getElementById("repValue").innerText = reputation; }

    function drawCard() {
        if (reputation < 10) { alert("大当家，声望不足！"); return; }
        reputation -= 10; updateReputationDisplay();

        const randomIndex = Math.floor(Math.random() * heroes.length);
        const drawnHero = heroes[randomIndex];
        
        const imgElement = document.getElementById("cardImage");
        const textElement = document.getElementById("cardText");
        
        imgElement.src = drawnHero.image;
        imgElement.style.display = "block";
        textElement.style.display = "none";

        if (!collectedHeroes.includes(drawnHero.id)) {
            collectedHeroes.push(drawnHero.id);
            document.getElementById("collectedCount").innerText = collectedHeroes.length;
            const galleryItem = document.getElementById("gallery-" + drawnHero.id);
            galleryItem.classList.add("unlocked");
        }
    }

    let currentQuestion = null;
    function loadQuestion() {
        const randomIndex = Math.floor(Math.random() * questions.length);
        currentQuestion = questions[randomIndex];
        document.getElementById("feedback").innerText = "";
        document.getElementById("questionBox").innerText = currentQuestion.question;
        const optionsBox = document.getElementById("optionsBox");
        optionsBox.innerHTML = "";
        for (let i = 0; i < currentQuestion.options.length; i++) {
            const btn = document.createElement("button");
            btn.className = "option-btn"; btn.innerText = currentQuestion.options[i];
            btn.onclick = function() { checkAnswer(i); };
            optionsBox.appendChild(btn);
        }
    }
    function checkAnswer(selectedIndex) {
        const feedback = document.getElementById("feedback");
        if (selectedIndex === currentQuestion.correctIndex) {
            feedback.style.color = "green"; feedback.innerText = currentQuestion.explanation;
            reputation += currentQuestion.reward; updateReputationDisplay();
        } else {
            feedback.style.color = "red"; feedback.innerText = "抉择失误！";
        }
        document.getElementById("optionsBox").innerHTML = "";
    }

    initGallery();
</script>

</body>
</html>
