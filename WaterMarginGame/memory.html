<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水浒点将 - 记忆翻牌试炼</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f4ecd8; text-align: center; padding: 20px; color: #333; margin: 0; background-image: url('images/bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }
        
        .container { 
            background: rgba(255, 250, 240, 0.95); 
            border: 4px solid #5c3a21; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 30px; 
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6); 
        }
        
        h1 { color: #8b0000; font-size: 28px; margin-bottom: 10px; border-bottom: 2px dashed #b89f7d; padding-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .stats-bar { font-size: 18px; font-weight: bold; background: rgba(139, 0, 0, 0.9); color: #fff; padding: 10px 20px; border-radius: 5px; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* 游戏棋盘 4x4 网格 */
        .memory-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 0 auto;
            perspective: 1000px; /* 开启 3D 视角 */
        }

        /* 单张卡牌容器 */
        .card {
            width: 100%;
            aspect-ratio: 1 / 1.2;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* 翻转状态 */
        .card.flipped { transform: rotateY(180deg); }

        /* 匹配成功状态 */
        .card.matched { transform: rotateY(180deg) scale(0.95); opacity: 0.8; cursor: default; }

        /* 卡牌的正反面通用样式 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 3px solid #5c3a21;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 牌背（未翻开时显示） */
        .card-back {
            background: radial-gradient(#a52a2a, #8b0000);
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
        }

        /* 牌面（英雄头像） */
        .card-front {
            background: #e8dcc4;
            transform: rotateY(180deg);
            flex-direction: column;
        }

        .card-front img {
            width: 100%;
            height: 70%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .card-front .hero-name {
            background: #4a3320;
            color: #fff;
            width: 100%;
            height: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border-top: 2px solid #5c3a21;
        }

        .btn { background-color: #2e8b57; color: white; border: none; padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; margin-top: 25px; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .btn:hover { background-color: #1e6b40; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container">
    <h1>校场试炼：盲牌点将</h1>
    <div class="stats-bar">已配对：<span id="matchCount">0</span> / 8 &nbsp;&nbsp;|&nbsp;&nbsp; 步数：<span id="moveCount">0</span></div>
    
    <div class="memory-board" id="memoryBoard">
        </div>
    
    <button class="btn" onclick="initGame()">重新洗牌</button>
</div>

<audio id="sndFlip" src="wrong.mp3"></audio> <audio id="sndMatch" src="correct.mp3"></audio>

<script>
    // 导入您的 36 天罡图库
    const allHeroes = [
        { id: "h1", name: "宋江", img: "songjiang.jpg" }, { id: "h2", name: "卢俊义", img: "lujunyi.jpg" },
        { id: "h3", name: "吴用", img: "wuyong.jpg" }, { id: "h4", name: "公孙胜", img: "gongsunsheng.jpg" },
        { id: "h5", name: "关胜", img: "guansheng.jpg" }, { id: "h6", name: "林冲", img: "linchong.jpg" },
        { id: "h7", name: "秦明", img: "qinming.jpg" }, { id: "h8", name: "呼延灼", img: "huyanzhuo.jpg" },
        { id: "h9", name: "花荣", img: "huarong.jpg" }, { id: "h10", name: "柴进", img: "chaijin.jpg" },
        { id: "h11", name: "李应", img: "liying.jpg" }, { id: "h12", name: "朱仝", img: "zhutong.jpg" },
        { id: "h13", name: "鲁智深", img: "luzhishen.jpg" }, { id: "h14", name: "武松", img: "wusong.jpg" },
        { id: "h15", name: "董平", img: "dongping.jpg" }, { id: "h16", name: "张清", img: "zhangqing.jpg" },
        { id: "h17", name: "杨志", img: "yangzhi.jpg" }, { id: "h18", name: "徐宁", img: "xuning.jpg" },
        { id: "h19", name: "索超", img: "suochao.jpg" }, { id: "h20", name: "戴宗", img: "daizong.jpg" },
        { id: "h21", name: "刘唐", img: "liutang.jpg" }, { id: "h22", name: "李逵", img: "likui.jpg" },
        { id: "h23", name: "史进", img: "shijin.jpg" }, { id: "h24", name: "穆弘", img: "muhong.jpg" },
        { id: "h25", name: "雷横", img: "leiheng.jpg" }, { id: "h26", name: "李俊", img: "lijun.jpg" },
        { id: "h27", name: "阮小二", img: "ruanxiaoer.jpg" }, { id: "h28", name: "张横", img: "zhangheng.jpg" },
        { id: "h29", name: "阮小五", img: "ruanxiaowu.jpg" }, { id: "h30", name: "张顺", img: "zhangshun.jpg" },
        { id: "h31", name: "阮小七", img: "ruanxiaoqi.jpg" }, { id: "h32", name: "杨雄", img: "yangxiong.jpg" },
        { id: "h33", name: "石秀", img: "shixiu.jpg" }, { id: "h34", name: "解珍", img: "xiezhen.jpg" },
        { id: "h35", name: "解宝", img: "xiebao.jpg" }, { id: "h36", name: "燕青", img: "yanqing.jpg" }
    ];

    let cardsArray = [];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchCount = 0;
    let moveCount = 0;

    const board = document.getElementById("memoryBoard");
    const sndMatch = document.getElementById("sndMatch");

    // 洗牌算法 (Fisher-Yates)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initGame() {
        board.innerHTML = '';
        matchCount = 0;
        moveCount = 0;
        firstCard = null;
        secondCard = null;
        lockBoard = false;
        updateStats();

        // 1. 随机从 36 人中抽取 8 位
        let shuffledHeroes = shuffle([...allHeroes]);
        let selectedHeroes = shuffledHeroes.slice(0, 8);

        // 2. 将这 8 位好汉复制一份，形成 16 张对子牌
        cardsArray = [...selectedHeroes, ...selectedHeroes];
        
        // 3. 打乱这 16 张牌
        cardsArray = shuffle(cardsArray);

        // 4. 渲染到页面
        cardsArray.forEach((hero, index) => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.dataset.name = hero.name;

            cardElement.innerHTML = `
                <div class="card-face card-front">
                    <img src="images/${hero.img}" alt="${hero.name}">
                    <div class="hero-name">${hero.name}</div>
                </div>
                <div class="card-face card-back">水浒</div>
            `;

            cardElement.addEventListener('click', flipCard);
            board.appendChild(cardElement);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!firstCard) {
            // 第一次点击
            firstCard = this;
            return;
        }

        // 第二次点击
        secondCard = this;
        moveCount++;
        updateStats();
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.name === secondCard.dataset.name;

        if (isMatch) {
            disableCards();
            matchCount++;
            updateStats();
            // 播放配对成功音效
            sndMatch.currentTime = 0;
            sndMatch.play();
            
            if (matchCount === 8) {
                setTimeout(() => alert("好记性！大当家，校场试炼完美通关！\n(未来通关可在此处触发增加主游戏声望的代码)"), 500);
            }
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        resetBoard();
    }

    function unflipCards() {
        lockBoard = true;
        // 延迟一秒钟后翻回去，让玩家有时间看清第二张牌
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 1000);
    }

    function resetBoard() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    function updateStats() {
        document.getElementById("matchCount").innerText = matchCount;
        document.getElementById("moveCount").innerText = moveCount;
    }

    // 页面加载完成直接启动游戏
    initGame();
</script>

</body>
</html>
