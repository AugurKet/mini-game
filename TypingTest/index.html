<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>TypeFury · 60‑second challenge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0b101a 0%, #18233a 100%);
      min-height: 100vh;
      display: flex;
-align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .game-card {
      max-width: 1000px;
      width: 100%;
      background: rgba(12, 22, 38, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 56px;
      border: 2px solid #3a61a0;
      box-shadow: 0 30px 50px -15px #000000, 0 0 0 1px #6883c0 inset;
      padding: 28px 24px 32px;
    }
    h1 {
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffe170, #ffad5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      filter: drop-shadow(0 4px 6px #00000080);
      margin-bottom: 6px;
    }
    .subhead {
      text-align: center;
      color: #b3ceff;
      font-size: 18px;
      margin-bottom: 24px;
    }
    .timer-panel {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 30px;
      background: #0c203b;
      border-radius: 100px;
      padding: 16px 35px;
      margin-bottom: 20px;
      border: 1px solid #4e76b0;
    }
    .timer {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .timer .label {
      color: #adc8f5;
      font-size: 22px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .timer .value {
      color: #ffe484;
      font-size: 58px;
      font-weight: 800;
      line-height: 1;
      font-family: monospace;
    }
    .stats {
      display: flex;
      gap: 35px;
    }
    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-label {
      color: #adc2e8;
      font-size: 18px;
    }
    .stat-number {
      color: #ffe484;
      font-size: 42px;
      font-weight: 800;
    }
    .difficulty-row {
      display: flex;
      gap: 15px;
      margin: 20px 0 25px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .difficulty-btn {
      border: none;
      background: #213a5a;
      padding: 16px 32px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      color: #cae0ff;
      cursor: pointer;
      box-shadow: 0 7px 0 #0f1d31;
      transition: 0.06s linear;
      border: 1px solid #5a7fb2;
      flex: 0 1 auto;
      min-width: 150px;
    }
    .difficulty-btn.active {
      background: #2e7d32;
      color: white;
      box-shadow: 0 4px 0 #1b4f1f;
      transform: translateY(3px);
      border-color: #a5d6a5;
    }
    .display-box {
      background: #0a1d33;
      border-radius: 50px;
      padding: 40px 25px;
      border: 3px solid #3d69a5;
      margin: 20px 0 22px;
      box-shadow: inset 0 5px 12px #00000080;
    }
    .target-phrase {
      text-align: center;
      font-size: clamp(28px, 7vw, 70px);
      font-weight: 700;
      color: #ffe484;
      text-shadow: 0 5px 0 #826e38;
      word-break: break-word;
      line-height: 1.4;
      font-family: 'Fira Mono', 'Courier New', monospace;
    }
    .input-area {
      display: flex;
      gap: 15px;
      background: #0f2642;
      border-radius: 120px;
      padding: 8px 8px 8px 30px;
      border: 2px solid #4e7bb8;
      margin: 25px 0 15px;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 34px;
      font-weight: 500;
      outline: none;
      min-width: 0;
      font-family: 'Fira Mono', 'Courier New', monospace;
    }
    #userInput::placeholder {
      color: #365882;
      font-size: 26px;
    }
    .submit-btn {
      background: #1f8b4c;
      border: none;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      color: white;
      font-size: 42px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 0 #0f4429;
      transition: 0.05s linear;
    }
    .submit-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #0f4429;
    }
    .submit-btn:disabled {
      opacity: 0.4;
      transform: none;
      box-shadow: 0 4px 0 #0f4429;
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 18px;
      margin: 10px 0 25px;
    }
    .action-btn {
      flex: 1;
      background: #2b4a78;
      border: none;
      padding: 18px 0;
      border-radius: 60px;
      font-size: 24px;
      font-weight: 700;
      color: #d9ecff;
      cursor: pointer;
      box-shadow: 0 7px 0 #13263f;
      transition: 0.05s linear;
      border: 1px solid #6f95d0;
    }
    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #13263f;
    }
    .history-box {
      background: #10263f;
      border-radius: 40px;
      padding: 18px 20px;
      border: 1px solid #48699c;
      margin-top: 15px;
    }
    .history-title {
      color: #ffda7a;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .history-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      justify-content: center;
      min-height: 50px;
    }
    .history-chip {
      background: #1f3d62;
      padding: 8px 24px;
      border-radius: 40px;
      border: 1px solid #f5b457;
      color: #ffdfa5;
      font-size: 24px;
      font-weight: 600;
      font-family: monospace;
    }
    .footer-message {
      text-align: center;
      color: #6f91bf;
      margin-top: 16px;
      font-size: 16px;
    }
    @media (max-width: 600px) {
      .timer .value { font-size: 42px; }
      .stat-number { font-size: 32px; }
      .difficulty-btn { font-size: 18px; padding: 12px 18px; min-width: 120px; }
    }
  </style>
</head>
<body>
<div class="game-card">
  <h1>⚡ TYPEFURY · 60s</h1>
  <div class="subhead">one minute · test your typing speed</div>

  <!-- Timer & real‑time stats -->
  <div class="timer-panel">
    <div class="timer">
      <span class="label">⏳</span>
      <span class="value" id="timerDisplay">60</span>
    </div>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">✓</span>
        <span class="stat-number" id="scoreDisplay">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">⌨️</span>
        <span class="stat-number" id="wpmDisplay">0</span>
      </div>
    </div>
  </div>

  <!-- Difficulty selector (exactly as requested) -->
  <div class="difficulty-row">
    <button id="easyBtn" class="difficulty-btn active">🔰 EASY · words</button>
    <button id="mediumBtn" class="difficulty-btn">🔷 MEDIUM · phrases (UPPER)</button>
    <button id="hardBtn" class="difficulty-btn">🔶 HARD · mixed case & punct</button>
  </div>

  <!-- challenge area -->
  <div class="display-box">
    <div class="target-phrase" id="targetPhrase">——</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="type here..." autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="submit-btn" id="submitBtn">↵</button>
  </div>

  <div class="action-row">
    <button class="action-btn" id="resetBtn">⟲ NEW GAME</button>
    <button class="action-btn" id="skipBtn">⏭ SKIP</button>
  </div>

  <!-- last correct items (history) -->
  <div class="history-box">
    <div class="history-title">📋 last correct entries</div>
    <div class="history-items" id="historyContainer">
      <span class="history-chip">——</span>
    </div>
  </div>
  <div class="footer-message">↵ Enter works · 60 seconds · capitals, spaces, punctuation</div>
</div>

<script>
  (function() {
    // ---------- PHRASE LIBRARIES (respecting difficulty rules) ----------

    // EASY: single words, final display will be UPPERCASE (via js)
    const easyWords = [
      "cat", "dog", "sun", "car", "bus", "hat", "ball", "book", "fish", "tree",
      "moon", "cake", "happy", "house", "mouse", "phone", "table", "chair", "door", "window",
      "apple", "water", "fire", "cloud", "star", "night", "day", "time", "shoe", "shirt",
      "bird", "fish", "frog", "duck", "lion", "bear", "wolf", "deer", "baby", "toy",
      "smile", "green", "black", "white", "bread", "milk", "sleep", "run", "jump", "read"
    ];

    // MEDIUM: phrases (with spaces) but everything will be shown as UPPERCASE (no punctuation)
    const mediumPhrases = [
      "quick brown fox", "typing is fun", "speed matters", "keep practicing",
      "sixty seconds", "challenge yourself", "words per minute", "focus and type",
      "morning coffee", "hello world", "coding session", "brain exercise",
      "never give up", "good luck", "stay positive", "learn something new",
      "keyboard master", "fast fingers", "muscle memory", "touch typing",
      "time flies", "one minute left", "almost there", "great job",
      "space bar", "shift key", "upper case", "lower case", "sentence test"
    ];

    // HARD: sentences with mixed case, punctuation, apostrophes, commas, etc.
    const hardSentences = [
      "I love coding!",
      "What's your name?",
      "Hello, world.",
      "Type faster... please!",
      "60 seconds left? Wow!",
      "Don't stop now.",
      "It's 2025; keep going.",
      "Cats & dogs are cute.",
      "Where is my coffee?",
      "Listen... can you hear?",
      "Ryan's laptop is fast.",
      "Feb 14th is Valentine's day!",
      "She said, 'hello'.",
      "How much? $100.",
      "3, 2, 1... Go!",
      "I've been typing well.",
      "Yes!!! you did it.",
      "Mind the gap — oops.",
      "Email: test@example.com",
      "Open the door, please.",
      "Battery at 5%? Charge!",
      "Hello, 世界",            // unicode mixed
      "It's 75° outside.",
      "Follow the ⭐ stars."
    ];

    // combine for infinite? but we use distinct sets per mode.

    // ---------- game state ----------
    let currentMode = 'easy';                // easy / medium / hard
    let currentSet = [...easyWords];
    let phraseList = [];                     // shuffled copy
    let currentPhrase = '';
    let score = 0;                           // number of correct entries
    let timeLeft = 60;                        // seconds
    let timerInterval = null;
    let gameActive = false;                   // true only when timer >0 and running
    let history = [];                         // last 6 correct (as string, display format)
    let startTimeMs = null;

    // DOM elements
    const targetEl = document.getElementById('targetPhrase');
    const userInput = document.getElementById('userInput');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const wpmDisplay = document.getElementById('wpmDisplay');
    const historyContainer = document.getElementById('historyContainer');
    const easyBtn = document.getElementById('easyBtn');
    const mediumBtn = document.getElementById('mediumBtn');
    const hardBtn = document.getElementById('hardBtn');

    // ---------- helper functions ----------
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // refill phraseList based on currentMode (and shuffle)
    function refillPhraseList() {
      if (currentMode === 'easy') currentSet = [...easyWords];
      else if (currentMode === 'medium') currentSet = [...mediumPhrases];
      else currentSet = [...hardSentences];  // hard

      phraseList = shuffleArray([...currentSet]);
    }

    // get next phrase (pop from list, refill if empty)
    function getNextPhrase() {
      if (phraseList.length === 0) refillPhraseList();
      return phraseList.pop();
    }

    // format phrase for display according to difficulty
    function formatForDisplay(phrase, mode) {
      if (mode === 'easy') {
        return phrase.toUpperCase();          // all caps, single word
      } else if (mode === 'medium') {
        return phrase.toUpperCase();          // all caps, but includes spaces
      } else {
        return phrase;                         // hard: keep original (mixed case, punctuation)
      }
    }

    // load new phrase into UI
    function loadNewPhrase() {
      if (!gameActive) return;                 // don't change if game not active (except reset)
      currentPhrase = getNextPhrase();
      targetEl.textContent = formatForDisplay(currentPhrase, currentMode);
      userInput.value = '';
      userInput.focus();
    }

    // update timer and wpm
    function updateTimerDisplay() {
      timerDisplay.textContent = timeLeft;
    }

    // calculate WPM based on score and elapsed time
    function computeWPM() {
      if (!gameActive || timeLeft >= 60) return 0;   // not started or just finished
      const elapsedMinutes = (60 - timeLeft) / 60;
      if (elapsedMinutes <= 0) return 0;
      // each correct phrase counts as 1 "word" (simplified, but fair for comparison)
      return Math.round(score / elapsedMinutes);
    }

    function refreshWPM() {
      wpmDisplay.textContent = computeWPM();
    }

    // add correct entry to history
    function addToHistory(phrase) {
      let displayPhrase = phrase;
      if (currentMode === 'easy' || currentMode === 'medium') {
        displayPhrase = phrase.toUpperCase();
      } // hard: keep as typed (original)
      history.unshift(displayPhrase);
      if (history.length > 6) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyContainer.innerHTML = '<span class="history-chip">——</span>';
        return;
      }
      historyContainer.innerHTML = history.map(p => `<span class="history-chip">${p}</span>`).join('');
    }

    // stop timer (game over)
    function stopGame() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      gameActive = false;
      submitBtn.disabled = true;
      userInput.disabled = true;
    }

    // start fresh game (keeping current mode)
    function resetGame() {
      // stop old timer
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      // reset vars
      timeLeft = 60;
      score = 0;
      history = [];
      gameActive = true;
      submitBtn.disabled = false;
      userInput.disabled = false;

      // refresh phrase list
      refillPhraseList();
      currentPhrase = getNextPhrase();
      targetEl.textContent = formatForDisplay(currentPhrase, currentMode);
      userInput.value = '';
      userInput.focus();

      // update displays
      timerDisplay.textContent = timeLeft;
      scoreDisplay.textContent = score;
      wpmDisplay.textContent = '0';
      renderHistory();

      // start timer
      timerInterval = setInterval(() => {
        timeLeft -= 1;
        timerDisplay.textContent = timeLeft;
        refreshWPM();

        if (timeLeft <= 0) {
          timeLeft = 0;
          timerDisplay.textContent = '0';
          stopGame();
          targetEl.textContent = '⏹ GAME OVER';
          userInput.disabled = true;
        }
      }, 1000);
    }

    // handle correct answer
    function handleCorrect() {
      if (!gameActive) return;
      score++;
      scoreDisplay.textContent = score;
      addToHistory(currentPhrase);
      refreshWPM();
      loadNewPhrase();           // automatically next
    }

    // handle mistake (just clear input, no penalty)
    function handleMistake() {
      if (!gameActive) return;
      // flash red briefly
      targetEl.style.color = '#ff8888';
      setTimeout(() => {
        targetEl.style.color = '#ffe484';
      }, 150);
      userInput.value = '';
      userInput.focus();
    }

    // ---------- event listeners ----------
    submitBtn.addEventListener('click', () => {
      if (!gameActive || !currentPhrase) return;
      const typed = userInput.value; // keep original case/spaces
      // compare depending on mode:
      let expected = currentPhrase;
      if (currentMode === 'easy' || currentMode === 'medium') {
        // case‑insensitive compare (but we show uppercase, stored lowercase)
        if (typed.toLowerCase() === currentPhrase.toLowerCase()) {
          handleCorrect();
        } else {
          handleMistake();
        }
      } else {
        // hard: exact match (including case & punctuation)
        if (typed === currentPhrase) {
          handleCorrect();
        } else {
          handleMistake();
        }
      }
    });

    // Enter key
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitBtn.click();
      }
    });

    // skip button (counts as mistake, load new phrase)
    skipBtn.addEventListener('click', () => {
      if (!gameActive) return;
      // no score change, just skip
      loadNewPhrase();
    });

    // reset button
    resetBtn.addEventListener('click', resetGame);

    // difficulty change (must reset game)
    function setMode(mode) {
      currentMode = mode;
      // update active class
      [easyBtn, mediumBtn, hardBtn].forEach(btn => btn.classList.remove('active'));
      if (mode === 'easy') easyBtn.classList.add('active');
      else if (mode === 'medium') mediumBtn.classList.add('active');
      else hardBtn.classList.add('active');

      // reset everything with new mode
      resetGame();
    }

    easyBtn.addEventListener('click', () => setMode('easy'));
    mediumBtn.addEventListener('click', () => setMode('medium'));
    hardBtn.addEventListener('click', () => setMode('hard'));

    // initialise
    function init() {
      setMode('easy');  // triggers resetGame
    }
    init();
  })();
</script>
</body>
</html>
