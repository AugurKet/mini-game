<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>TypeFury Pro · stats & sound</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0a101c 0%, #172237 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .game-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(10, 20, 36, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 60px;
      border: 2px solid #3e68b0;
      box-shadow: 0 30px 50px -15px #000, 0 0 0 1px #708ac8 inset;
      padding: 30px 28px 35px;
    }
    h1 {
      text-align: center;
      font-size: 52px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffdb7c, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      filter: drop-shadow(0 4px 6px #000000b0);
      margin-bottom: 4px;
    }
    .sub {
      text-align: center;
      color: #b5d0ff;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .top-dashboard {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #0f2645;
      border-radius: 100px;
      padding: 12px 28px;
      margin-bottom: 20px;
      border: 1px solid #557dc0;
    }
    .timer-block {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .timer-label {
      color: #b3d0ff;
      font-size: 24px;
    }
    .timer-value {
      color: #ffe484;
      font-size: 58px;
      font-weight: 800;
      font-family: monospace;
    }
    .live-stats {
      display: flex;
      gap: 30px;
    }
    .live-stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .live-stat .label {
      color: #b7d0f0;
      font-size: 20px;
    }
    .live-stat .number {
      color: #ffe484;
      font-size: 42px;
      font-weight: 800;
    }
    .difficulty-panel {
      display: flex;
      gap: 15px;
      margin: 15px 0 25px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .difficulty-btn {
      border: none;
      background: #253f63;
      padding: 16px 34px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 700;
      color: #d3e6ff;
      cursor: pointer;
      box-shadow: 0 7px 0 #112439;
      transition: 0.06s linear;
      border: 1px solid #6182bb;
      min-width: 180px;
    }
    .difficulty-btn.active {
      background: #2e7d32;
      color: white;
      box-shadow: 0 4px 0 #1e5622;
      transform: translateY(3px);
      border-color: #a5d6a7;
    }
    .arena {
      background: #0a1f39;
      border-radius: 50px;
      padding: 35px 25px;
      border: 3px solid #3f6bb5;
      margin: 15px 0 25px;
      box-shadow: inset 0 5px 12px #000000b0;
    }
    .target-phrase {
      text-align: center;
      font-size: clamp(32px, 8vw, 72px);
      font-weight: 700;
      color: #ffe484;
      text-shadow: 0 5px 0 #826e38;
      word-break: break-word;
      line-height: 1.4;
      font-family: 'Fira Mono', 'Courier New', monospace;
      transition: transform 0.08s;
    }
    .target-phrase.keypress-flash {
      transform: scale(1.02);
      color: #fff0b5;
    }
    .input-area {
      display: flex;
      gap: 15px;
      background: #102b4a;
      border-radius: 120px;
      padding: 8px 8px 8px 30px;
      border: 2px solid #5880c0;
      margin: 30px 0 20px;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 38px;
      font-weight: 500;
      outline: none;
      min-width: 0;
      font-family: 'Fira Mono', 'Courier New', monospace;
    }
    #userInput::placeholder {
      color: #345e96;
      font-size: 28px;
    }
    .submit-btn {
      background: #1f8b4c;
      border: none;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      color: white;
      font-size: 46px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 0 #0f4429;
      transition: 0.05s linear;
    }
    .submit-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #0f4429;
    }
    .submit-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 20px;
      margin: 10px 0 25px;
    }
    .action-btn {
      flex: 1;
      background: #2b4f82;
      border: none;
      padding: 18px 0;
      border-radius: 60px;
      font-size: 26px;
      font-weight: 700;
      color: #e3f0ff;
      cursor: pointer;
      box-shadow: 0 7px 0 #142b48;
      transition: 0.05s linear;
      border: 1px solid #779bd1;
    }
    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #142b48;
    }
    .stats-panel {
      background: #0e2542;
      border-radius: 40px;
      padding: 22px 20px;
      margin: 20px 0 15px;
      border: 1px solid #4d71aa;
    }
    .stats-title {
      color: #ffda7a;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }
    .stat-card {
      background: #1d3b60;
      border-radius: 30px;
      padding: 18px 10px;
      text-align: center;
      border: 1px solid #c3a156;
    }
    .stat-card .label {
      color: #bfd8ff;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .stat-card .value {
      color: #ffe484;
      font-size: 42px;
      font-weight: 800;
    }
    .stat-card.small .value {
      font-size: 30px;
    }
    .history-box {
      background: #10263f;
      border-radius: 40px;
      padding: 18px 22px;
      border: 1px solid #4e73b0;
      margin-top: 10px;
    }
    .history-title {
      color: #ffda7a;
      font-size: 24px;
      margin-bottom: 12px;
    }
    .history-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      justify-content: center;
      min-height: 60px;
    }
    .history-chip {
      background: #20426b;
      padding: 10px 28px;
      border-radius: 40px;
      border: 1px solid #f5b457;
      color: #ffdfa5;
      font-size: 26px;
      font-weight: 600;
      font-family: monospace;
    }
    .footer {
      text-align: center;
      color: #6d90c2;
      margin-top: 20px;
      font-size: 17px;
    }
    @media (max-width: 650px) {
      .live-stat .number { font-size: 32px; }
      .timer-value { font-size: 44px; }
    }
  </style>
</head>
<body>
<div class="game-card">
  <h1>⚡ TYPEFURY · ENHANCED</h1>
  <div class="sub">sound · animation · full stats · english only</div>

  <!-- top bar with timer & live wpm/errors -->
  <div class="top-dashboard">
    <div class="timer-block">
      <span class="timer-label">⏳</span>
      <span class="timer-value" id="timerDisplay">60</span>
    </div>
    <div class="live-stats">
      <div class="live-stat">
        <span class="label">WPM</span>
        <span class="number" id="liveWpm">0</span>
      </div>
      <div class="live-stat">
        <span class="label">❌</span>
        <span class="number" id="liveMistakes">0</span>
      </div>
    </div>
  </div>

  <!-- difficulty selector (english only) -->
  <div class="difficulty-panel">
    <button id="easyBtn" class="difficulty-btn active">🔰 EASY · words</button>
    <button id="mediumBtn" class="difficulty-btn">🔷 MEDIUM · phrases (UPPER)</button>
    <button id="hardBtn" class="difficulty-btn">🔶 HARD · mixed case & punct</button>
  </div>

  <!-- main typing arena -->
  <div class="arena">
    <div class="target-phrase" id="targetPhrase">——</div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="type here..." autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="submit-btn" id="submitBtn">↵</button>
    </div>
    <div class="action-row">
      <button class="action-btn" id="resetBtn">⟲ NEW GAME</button>
      <button class="action-btn" id="skipBtn">⏭ SKIP</button>
    </div>
  </div>

  <!-- detailed end‑game stats panel (visible after finish) -->
  <div class="stats-panel" id="statsPanel" style="display: none;">
    <div class="stats-title">📊 SESSION REPORT</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">FINAL WPM</div>
        <div class="value" id="finalWpm">0</div>
      </div>
      <div class="stat-card">
        <div class="label">ACCURACY</div>
        <div class="value" id="accuracyDisplay">100%</div>
      </div>
      <div class="stat-card">
        <div class="label">MISTAKES</div>
        <div class="value" id="totalMistakes">0</div>
      </div>
      <div class="stat-card small">
        <div class="label">FASTEST WORD</div>
        <div class="value" id="fastestWord">---</div>
      </div>
      <div class="stat-card small">
        <div class="label">SLOWEST WORD</div>
        <div class="value" id="slowestWord">---</div>
      </div>
    </div>
  </div>

  <!-- last correct words history -->
  <div class="history-box">
    <div class="history-title">📋 RECENT CORRECT</div>
    <div class="history-items" id="historyContainer">
      <span class="history-chip">——</span>
    </div>
  </div>
  <div class="footer">sound on · keypress animations · english only · 60 seconds</div>
</div>

<script>
  (function() {
    // ---------- ENGLISH‑ONLY LIBRARIES (no foreign characters) ----------
    const easyWords = [
      "cat", "dog", "sun", "car", "bus", "hat", "ball", "book", "fish", "tree",
      "moon", "cake", "happy", "house", "mouse", "phone", "table", "chair", "door", "window",
      "apple", "water", "fire", "cloud", "star", "night", "day", "time", "shoe", "shirt",
      "bird", "fish", "frog", "duck", "lion", "bear", "wolf", "deer", "baby", "toy",
      "smile", "green", "black", "white", "bread", "milk", "sleep", "run", "jump", "read",
      "quick", "brown", "fox", "jumps", "lazy", "dog", "hello", "world", "type", "fast"
    ];

    const mediumPhrases = [
      "quick brown fox", "typing is fun", "speed matters", "keep practicing",
      "sixty seconds", "challenge yourself", "words per minute", "focus and type",
      "morning coffee", "hello world", "coding session", "brain exercise",
      "never give up", "good luck", "stay positive", "learn something new",
      "keyboard master", "fast fingers", "muscle memory", "touch typing",
      "time flies", "one minute left", "almost there", "great job",
      "space bar", "shift key", "upper case", "lower case", "sentence test",
      "practice makes perfect", "type faster please", "keep going", "very good"
    ];

    const hardSentences = [
      "I love coding!",
      "What's your name?",
      "Hello, world.",
      "Type faster... please!",
      "60 seconds left? Wow!",
      "Don't stop now.",
      "It's 2025; keep going.",
      "Cats & dogs are cute.",
      "Where is my coffee?",
      "Listen... can you hear?",
      "Ryan's laptop is fast.",
      "Feb 14th is Valentine's day!",
      "She said, 'hello'.",
      "How much? $100.",
      "3, 2, 1... Go!",
      "I've been typing well.",
      "Yes!!! you did it.",
      "Mind the gap -- oops.",
      "Email: test at example dot com",
      "Open the door, please.",
      "Battery at 5%? Charge!",
      "Follow the stars."
    ];

    // ---------- game state ----------
    let currentMode = 'easy';
    let currentSet = [...easyWords];
    let phraseList = [];
    let currentPhrase = '';
    let score = 0;                 // number of correct entries
    let mistakeCount = 0;           // total wrong submissions
    let timeLeft = 60;
    let timerInterval = null;
    let gameActive = false;
    let history = [];               // last 6 correct phrases (display format)

    // stats for fastest/slowest word (typing time per word)
    let wordTimings = [];            // { phrase: string, durationMs: number, length: number }
    let lastWordStartTime = null;

    // sound effects (using Web Audio API)
    let audioCtx = null;
    function playSound(type) {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      const now = audioCtx.currentTime;
      if (type === 'correct') {
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'mistake') {
        osc.frequency.value = 320;
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'keypress') {
        // subtle key click
        osc.frequency.value = 440;
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    // DOM elements
    const targetEl = document.getElementById('targetPhrase');
    const userInput = document.getElementById('userInput');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const liveWpm = document.getElementById('liveWpm');
    const liveMistakes = document.getElementById('liveMistakes');
    const finalWpm = document.getElementById('finalWpm');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const totalMistakes = document.getElementById('totalMistakes');
    const fastestWord = document.getElementById('fastestWord');
    const slowestWord = document.getElementById('slowestWord');
    const statsPanel = document.getElementById('statsPanel');
    const historyContainer = document.getElementById('historyContainer');
    const easyBtn = document.getElementById('easyBtn');
    const mediumBtn = document.getElementById('mediumBtn');
    const hardBtn = document.getElementById('hardBtn');

    // helper: shuffle array
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function refillPhraseList() {
      if (currentMode === 'easy') currentSet = [...easyWords];
      else if (currentMode === 'medium') currentSet = [...mediumPhrases];
      else currentSet = [...hardSentences];
      phraseList = shuffleArray([...currentSet]);
    }

    function getNextPhrase() {
      if (phraseList.length === 0) refillPhraseList();
      return phraseList.pop();
    }

    function formatForDisplay(phrase, mode) {
      if (mode === 'easy' || mode === 'medium') return phrase.toUpperCase();
      return phrase;  // hard: keep original
    }

    // record timing for the completed word
    function recordWordTiming(phrase) {
      if (lastWordStartTime) {
        const endTime = Date.now();
        const duration = endTime - lastWordStartTime;
        wordTimings.push({ phrase, duration, length: phrase.length });
      }
      lastWordStartTime = Date.now();  // start next word
    }

    // load new phrase
    function loadNewPhrase() {
      if (!gameActive) return;
      currentPhrase = getNextPhrase();
      targetEl.textContent = formatForDisplay(currentPhrase, currentMode);
      userInput.value = '';
      userInput.focus();
      // start timing for this word (if first word, set now)
      if (!lastWordStartTime) lastWordStartTime = Date.now();
    }

    // update live WPM (based on average over last few words? simpler: instantaneous)
    function refreshLiveWpm() {
      if (!gameActive) return;
      if (wordTimings.length === 0) {
        liveWpm.textContent = '0';
        return;
      }
      // use last 5 words or all
      const recent = wordTimings.slice(-5);
      let totalChars = 0;
      let totalSec = 0;
      recent.forEach(t => {
        totalChars += t.length;
        totalSec += t.duration / 1000;
      });
      if (totalSec === 0) return;
      const wpm = Math.round((totalChars / 5) / (totalSec / 60));
      liveWpm.textContent = wpm > 200 ? 200 : wpm;
    }

    // compute final stats
    function showEndStats() {
      // WPM: total chars / 5 / minute
      const totalChars = wordTimings.reduce((acc, t) => acc + t.length, 0);
      const elapsedMinutes = 1; // 60 seconds
      const finalWpmValue = Math.round((totalChars / 5) / elapsedMinutes);
      finalWpm.textContent = finalWpmValue || 0;

      const totalAttempts = score + mistakeCount;
      const accuracy = totalAttempts === 0 ? 100 : Math.round((score / totalAttempts) * 100);
      accuracyDisplay.textContent = accuracy + '%';
      totalMistakes.textContent = mistakeCount;

      // fastest / slowest (by duration per character? use total duration for fair)
      if (wordTimings.length > 0) {
        const withSpeed = wordTimings.map(w => ({
          ...w,
          timePerChar: w.duration / w.length
        }));
        withSpeed.sort((a, b) => a.timePerChar - b.timePerChar);
        const fastest = withSpeed[0];
        const slowest = withSpeed[withSpeed.length - 1];
        fastestWord.textContent = fastest.phrase.length > 12 ? fastest.phrase.substring(0,10)+'…' : fastest.phrase;
        slowestWord.textContent = slowest.phrase.length > 12 ? slowest.phrase.substring(0,10)+'…' : slowest.phrase;
      } else {
        fastestWord.textContent = '---';
        slowestWord.textContent = '---';
      }
      statsPanel.style.display = 'block';
    }

    // stop game (time over)
    function stopGame() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      gameActive = false;
      submitBtn.disabled = true;
      userInput.disabled = true;
      showEndStats();
    }

    // reset game (new session)
    function resetGame() {
      if (timerInterval) clearInterval(timerInterval);
      timeLeft = 60;
      score = 0;
      mistakeCount = 0;
      wordTimings = [];
      lastWordStartTime = null;
      history = [];
      gameActive = true;
      submitBtn.disabled = false;
      userInput.disabled = false;
      statsPanel.style.display = 'none';

      refillPhraseList();
      currentPhrase = getNextPhrase();
      targetEl.textContent = formatForDisplay(currentPhrase, currentMode);
      userInput.value = '';
      userInput.focus();
      lastWordStartTime = Date.now();  // start timing first word

      timerDisplay.textContent = timeLeft;
      liveMistakes.textContent = '0';
      liveWpm.textContent = '0';
      renderHistory();

      timerInterval = setInterval(() => {
        timeLeft -= 1;
        timerDisplay.textContent = timeLeft;
        refreshLiveWpm();

        if (timeLeft <= 0) {
          timeLeft = 0;
          timerDisplay.textContent = '0';
          stopGame();
          targetEl.textContent = '⏹ GAME OVER';
        }
      }, 1000);
    }

    // history render
    function addToHistory(phrase) {
      let display = (currentMode === 'easy' || currentMode === 'medium') ? phrase.toUpperCase() : phrase;
      history.unshift(display);
      if (history.length > 6) history.pop();
      renderHistory();
    }
    function renderHistory() {
      if (history.length === 0) {
        historyContainer.innerHTML = '<span class="history-chip">——</span>';
        return;
      }
      historyContainer.innerHTML = history.map(p => `<span class="history-chip">${p}</span>`).join('');
    }

    // handle correct
    function handleCorrect() {
      if (!gameActive) return;
      playSound('correct');
      recordWordTiming(currentPhrase);
      score++;
      liveMistakes.textContent = mistakeCount; // unchanged
      addToHistory(currentPhrase);
      refreshLiveWpm();
      loadNewPhrase();
    }

    // handle mistake
    function handleMistake() {
      if (!gameActive) return;
      playSound('mistake');
      mistakeCount++;
      liveMistakes.textContent = mistakeCount;
      // flash red
      targetEl.style.color = '#ff8888';
      setTimeout(() => targetEl.style.color = '#ffe484', 150);
      userInput.value = '';
      userInput.focus();
    }

    // keypress animation + subtle click
    userInput.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      if (e.key.length === 1) { // printable character
        playSound('keypress');
        targetEl.classList.add('keypress-flash');
        setTimeout(() => targetEl.classList.remove('keypress-flash'), 100);
      }
    });

    // submit
    submitBtn.addEventListener('click', () => {
      if (!gameActive || !currentPhrase) return;
      const typed = userInput.value;
      let expected = currentPhrase;
      if (currentMode === 'easy' || currentMode === 'medium') {
        if (typed.toLowerCase() === currentPhrase.toLowerCase()) handleCorrect();
        else handleMistake();
      } else {
        if (typed === currentPhrase) handleCorrect();
        else handleMistake();
      }
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitBtn.click();
      }
    });

    skipBtn.addEventListener('click', () => {
      if (!gameActive) return;
      // skip counts as mistake? we count it as mistake to be fair
      mistakeCount++;
      liveMistakes.textContent = mistakeCount;
      playSound('mistake');
      loadNewPhrase();
    });

    resetBtn.addEventListener('click', resetGame);

    function setMode(mode) {
      currentMode = mode;
      [easyBtn, mediumBtn, hardBtn].forEach(b => b.classList.remove('active'));
      if (mode === 'easy') easyBtn.classList.add('active');
      else if (mode === 'medium') mediumBtn.classList.add('active');
      else hardBtn.classList.add('active');
      resetGame();
    }

    easyBtn.addEventListener('click', () => setMode('easy'));
    mediumBtn.addEventListener('click', () => setMode('medium'));
    hardBtn.addEventListener('click', () => setMode('hard'));

    // init
    setMode('easy');
  })();
</script>
</body>
</html>
