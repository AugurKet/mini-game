<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>指尖极速 · 打字测验</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0c1320 0%, #1a2639 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .game-card {
      max-width: 950px;
      width: 100%;
      background: rgba(12, 22, 38, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 48px;
      border: 2px solid #385d9a;
      box-shadow: 0 25px 45px -10px #000000, 0 0 0 1px #5b7db9 inset;
      padding: 24px 22px 30px;
    }
    h1 {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffe484, #ffb74d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 5px #00000070);
    }
    .sub {
      text-align: center;
      color: #9fbfe3;
      font-size: 18px;
      margin-bottom: 24px;
      font-weight: 400;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px 30px;
      background: #14263f;
      border-radius: 80px;
      padding: 18px 25px;
      margin-bottom: 25px;
      border: 1px solid #5377aa;
    }
    .stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .stat-label {
      color: #adc6f0;
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      color: #ffe484;
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
    }
    .stat-unit {
      color: #96b5dd;
      font-size: 16px;
      margin-left: 4px;
    }
    .difficulty-panel {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .difficulty-btn {
      border: none;
      background: #1f3652;
      padding: 14px 30px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 700;
      color: #bdd4ff;
      cursor: pointer;
      box-shadow: 0 6px 0 #0d1b2c;
      transition: 0.06s linear;
      border: 1px solid #54709c;
      flex: 0 1 auto;
    }
    .difficulty-btn.active {
      background: #2e7d32;
      color: white;
      box-shadow: 0 3px 0 #1b4d1f;
      transform: translateY(3px);
      border-color: #93c47d;
    }
    .word-arena {
      background: #0a192b;
      border-radius: 40px;
      padding: 35px 18px;
      border: 3px solid #385f8f;
      margin-bottom: 25px;
      box-shadow: inset 0 5px 10px #00000070;
    }
    .target-word {
      text-align: center;
      font-size: clamp(42px, 12vw, 90px);
      font-weight: 800;
      letter-spacing: 6px;
      color: #ffe484;
      text-shadow: 0 6px 0 #8e6d34, 0 12px 20px black;
      word-break: break-word;
      line-height: 1.2;
      margin-bottom: 25px;
      text-transform: uppercase;
    }
    .progress-bar {
      width: 100%;
      height: 22px;
      background: #1e3452;
      border-radius: 40px;
      overflow: hidden;
      margin: 15px 0 25px;
      border: 1px solid #5a7cb1;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #77dd77, #45b787);
      transition: width 0.2s ease;
      border-radius: 40px;
    }
    .type-area {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #10243e;
      border-radius: 120px;
      padding: 8px 8px 8px 28px;
      border: 2px solid #4a71a5;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 32px;
      font-weight: 600;
      outline: none;
      min-width: 0;
      text-transform: lowercase;
    }
    #userInput::placeholder {
      color: #3a5779;
      font-size: 24px;
      font-weight: 400;
    }
    .check-btn {
      background: #1f8b4c;
      border: none;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      color: white;
      font-size: 38px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 0 #0e4525;
      transition: 0.05s linear;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #0e4525;
    }
    .check-btn:disabled {
      opacity: 0.4;
      transform: none;
      box-shadow: 0 4px 0 #0e4525;
      pointer-events: none;
    }
    .actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1 1 160px;
      background: #2f4b78;
      border: none;
      padding: 18px 10px;
      border-radius: 60px;
      font-size: 22px;
      font-weight: 700;
      color: #dbecff;
      cursor: pointer;
      box-shadow: 0 7px 0 #142639;
      transition: 0.05s linear;
      border: 1px solid #7393c4;
    }
    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #142639;
    }
    .history {
      background: #0c2037;
      border-radius: 30px;
      padding: 18px;
      margin-top: 25px;
      border: 1px solid #436094;
    }
    .history-title {
      color: #ffd966;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      justify-content: center;
      max-height: 120px;
      overflow-y: auto;
      padding: 5px;
      color: #bbd5ff;
      font-size: 22px;
      font-weight: 600;
    }
    .history-item {
      background: #1d3857;
      padding: 8px 22px;
      border-radius: 40px;
      border: 1px solid #dba959;
      color: #ffe4a2;
    }
    .footer-note {
      text-align: center;
      color: #5d7aa3;
      margin-top: 20px;
      font-size: 15px;
    }
    /* 手机优化 */
    @media (max-width: 550px) {
      .game-card { padding: 18px; }
      .stat-value { font-size: 28px; }
      .dashboard { gap: 12px; }
      #userInput { font-size: 26px; }
      .check-btn { width: 65px; height: 65px; font-size: 32px; }
    }
  </style>
</head>
<body>
<div class="game-card">
  <h1>⚡ 指尖极速 · Type Rush</h1>
  <div class="sub">考验你的打字速度 · 手机/电脑通用</div>

  <!-- 实时仪表盘 -->
  <div class="dashboard">
    <div class="stat">
      <span class="stat-label">WPM</span>
      <span class="stat-value" id="wpmValue">0</span>
      <span class="stat-unit">词/分钟</span>
    </div>
    <div class="stat">
      <span class="stat-label">准确率</span>
      <span class="stat-value" id="accValue">100</span>
      <span class="stat-unit">%</span>
    </div>
    <div class="stat">
      <span class="stat-label">已打</span>
      <span class="stat-value" id="typedCount">0</span>
      <span class="stat-unit">字</span>
    </div>
  </div>

  <!-- 难度切换 -->
  <div class="difficulty-panel">
    <button id="easyMode" class="difficulty-btn active">🍃 简单</button>
    <button id="mediumMode" class="difficulty-btn">🌓 中等</button>
    <button id="hardMode" class="difficulty-btn">🗻 困难</button>
    <button id="infiniteBtn" class="difficulty-btn">♾️ 无限</button>
  </div>

  <!-- 打字核心区 -->
  <div class="word-arena">
    <div class="target-word" id="currentWord">loading</div>

    <!-- 进度条（显示本组进度） -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <!-- 输入框 + 确认按钮 -->
    <div class="type-area">
      <input type="text" id="userInput" placeholder="在这里打字..." autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="check-btn" id="submitBtn">↵</button>
    </div>

    <!-- 辅助操作 -->
    <div class="actions">
      <button class="action-btn" id="nextBtn">⏩ 下一个</button>
      <button class="action-btn" id="resetBtn">🔄 重新开始</button>
    </div>
  </div>

  <!-- 最近打对的词 (历史记录) -->
  <div class="history">
    <div class="history-title">📋 最近正确</div>
    <div class="history-list" id="historyList">
      <span class="history-item">--</span>
    </div>
  </div>
  <div class="footer-note">按回车 / 点击✓提交 · 实时计算速度 · 越打越快！</div>
</div>

<script>
  (function() {
    // ---------- 词库 (简单/中等/困难) + 无限模式使用混合 ----------
    const wordBank = {
      easy: [
        "cat", "dog", "sun", "car", "bus", "hat", "ball", "book", "fish", "tree",
        "moon", "cake", "happy", "house", "mouse", "phone", "table", "chair", "door", "window",
        "apple", "water", "fire", "cloud", "star", "night", "day", "time", "shoe", "shirt",
        "bird", "fish", "frog", "duck", "lion", "bear", "wolf", "deer", "baby", "toy"
      ],
      medium: [
        "guitar", "piano", "violin", "drum", "music", "dance", "rainbow", "purple", "orange", "yellow",
        "bicycle", "train", "rocket", "breakfast", "chocolate", "kitchen", "garden", "blanket", "pillow", "curtain",
        "weather", "hurricane", "thunder", "lightning", "butterfly", "dragonfly", "penguin", "dolphin", "whale", "shark",
        "astronaut", "scientist", "doctor", "engineer", "library", "museum", "theater", "hospital", "castle", "island",
        "sunrise", "sunset", "universe", "galaxy", "planet", "dinosaur", "fossil", "ancient", "language", "dictionary"
      ],
      hard: [
        "exaggerate", "accommodate", "accomplish", "accumulate", "achievement", "acknowledge", "acquaintance", "aggressive",
        "ambiguous", "ambitious", "anniversary", "anticipate", "apologize", "apparatus", "appropriate", "architecture",
        "atmosphere", "beautiful", "beginning", "behaviour", "brilliant", "business", "calendar", "campaign",
        "candidate", "category", "celebration", "cemetery", "certainty", "challenge", "character", "circumstance",
        "civilization", "colleague", "combination", "comfortable", "commercial", "commission", "committee", "communicate",
        "comparison", "competition", "completely", "concentrate", "conception", "conclusion", "confidence", "confirmation",
        "congratulate", "conscious", "consequence", "consistent", "constitution", "construction", "contemporary", "continuous"
      ]
    };

    // 无限模式混合所有词
    const infiniteBank = [...wordBank.easy, ...wordBank.medium, ...wordBank.hard];

    // ---------- 游戏状态 ----------
    let currentMode = 'easy';               // easy / medium / hard / infinite
    let currentSet = [...wordBank.easy];
    let wordList = [];                      // 当前使用的词库副本 (不断轮转)
    let currentWord = '';
    let typedCount = 0;                     // 正确次数 (总正确单词数)
    let startTime = null;                    // 本轮开始时间 (用于计算瞬时wpm)
    let wordHistory = [];                     // 存储最近正确单词 (最多6个)
    let totalKeystrokes = 0;                  // 总击键 (正确+错误)
    let correctKeystrokes = 0;                // 正确击键数 (用于准确率)
    let lastResetTime = Date.now();

    // DOM 元素
    const currentWordEl = document.getElementById('currentWord');
    const userInput = document.getElementById('userInput');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const wpmSpan = document.getElementById('wpmValue');
    const accSpan = document.getElementById('accValue');
    const typedCountSpan = document.getElementById('typedCount');
    const progressFill = document.getElementById('progressFill');
    const historyList = document.getElementById('historyList');
    const easyBtn = document.getElementById('easyMode');
    const mediumBtn = document.getElementById('mediumMode');
    const hardBtn = document.getElementById('hardMode');
    const infiniteBtn = document.getElementById('infiniteBtn');

    // ---------- 辅助函数 ----------
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 根据模式重新填充词库 (打乱)
    function refillWordList() {
      if (currentMode === 'easy') currentSet = [...wordBank.easy];
      else if (currentMode === 'medium') currentSet = [...wordBank.medium];
      else if (currentMode === 'hard') currentSet = [...wordBank.hard];
      else currentSet = [...infiniteBank];  // infinite

      wordList = shuffleArray([...currentSet]);
    }

    // 获取下一个词 (从wordList中取，如果空了就重新填充)
    function getNextWordFromList() {
      if (wordList.length === 0) {
        refillWordList();
      }
      return wordList.pop();  // 从末尾取 (性能较好)
    }

    // 更新UI: 当前词，重置输入
    function loadNewWord() {
      currentWord = getNextWordFromList();
      currentWordEl.textContent = currentWord.toUpperCase();
      userInput.value = '';
      userInput.focus();
      // 进度条稍后由准确率驱动？ 改成每次新词进度重置 (代表本词完成度 0/1)
      progressFill.style.width = '0%';
    }

    // 计算wpm (基于当前正确次数和已用时间)
    function updateWPM() {
      if (!startTime) {
        wpmSpan.textContent = '0';
        return;
      }
      const elapsedMinutes = (Date.now() - startTime) / 60000;
      if (elapsedMinutes <= 0) {
        wpmSpan.textContent = '0';
        return;
      }
      // WPM = (正确字符数 / 5) / 分钟   (传统算法: 一个词算5个字符)
      const typedWords = correctKeystrokes / 5;
      const wpm = Math.round(typedWords / elapsedMinutes);
      wpmSpan.textContent = wpm > 300 ? 300 : wpm;  // 合理上限
    }

    // 更新准确率
    function updateAccuracy() {
      if (totalKeystrokes === 0) {
        accSpan.textContent = '100';
        return;
      }
      const acc = Math.round((correctKeystrokes / totalKeystrokes) * 100);
      accSpan.textContent = acc;
    }

    // 添加历史记录
    function addHistory(word) {
      wordHistory.unshift(word.toUpperCase());
      if (wordHistory.length > 6) wordHistory.pop();
      renderHistory();
    }

    function renderHistory() {
      if (wordHistory.length === 0) {
        historyList.innerHTML = '<span class="history-item">--</span>';
        return;
      }
      historyList.innerHTML = wordHistory.map(w => `<span class="history-item">${w}</span>`).join('');
    }

    // 重置整个游戏 (保留模式)
    function resetGame() {
      // 重置计数
      typedCount = 0;
      totalKeystrokes = 0;
      correctKeystrokes = 0;
      wordHistory = [];
      startTime = Date.now();        // 重新计时
      typedCountSpan.textContent = '0';
      wpmSpan.textContent = '0';
      accSpan.textContent = '100';
      progressFill.style.width = '0%';

      // 重新填充词库
      refillWordList();
      loadNewWord();
      renderHistory();
    }

    // 处理正确输入
    function handleCorrect() {
      typedCount++;
      typedCountSpan.textContent = typedCount;
      
      // 正确击键: 单词长度计入正确击键 (假设用户正确打出了每个字母)
      const wordLen = currentWord.length;
      correctKeystrokes += wordLen;
      totalKeystrokes += wordLen;   // 正确时当然也增加了总击键
      
      addHistory(currentWord);
      updateWPM();
      updateAccuracy();

      // 进度条暂时简单显示 (这一词完成度)
      progressFill.style.width = '100%';
      
      // 自动加载下一个词
      loadNewWord();
    }

    // 处理错误 (由提交触发)
    function handleMistake() {
      // 错误击键：用户输入的长度 (他们打错的字符数)
      const wrongLen = userInput.value.length;
      totalKeystrokes += wrongLen;
      
      // 也可以增加一点点惩罚进度条不动
      updateAccuracy();
      
      // 闪烁提示
      currentWordEl.style.color = '#ff8888';
      setTimeout(() => {
        currentWordEl.style.color = '#ffe484';
      }, 200);
      
      // 清空重新输入
      userInput.value = '';
      userInput.focus();
      // 进度条不变 (0%)
    }

    // ---------- 事件绑定 ----------
    submitBtn.addEventListener('click', () => {
      if (!currentWord) return;
      const inputVal = userInput.value.trim().toLowerCase();
      if (inputVal === '') return;

      if (inputVal === currentWord) {
        handleCorrect();
      } else {
        handleMistake();
      }
    });

    // 回车提交
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitBtn.click();
      }
    });

    // 下一个按钮 (跳过当前，视为错误但不算击键惩罚？直接换词)
    nextBtn.addEventListener('click', () => {
      if (!currentWord) return;
      // 不增加总击键，只是跳过
      loadNewWord();
    });

    // 重置按钮
    resetBtn.addEventListener('click', resetGame);

    // 难度切换
    function setMode(mode) {
      currentMode = mode;
      // 更新active样式
      [easyBtn, mediumBtn, hardBtn, infiniteBtn].forEach(btn => btn.classList.remove('active'));
      if (mode === 'easy') easyBtn.classList.add('active');
      else if (mode === 'medium') mediumBtn.classList.add('active');
      else if (mode === 'hard') hardBtn.classList.add('active');
      else infiniteBtn.classList.add('active');
      
      resetGame();  // 重置所有数据，重新开始
    }

    easyBtn.addEventListener('click', () => setMode('easy'));
    mediumBtn.addEventListener('click', () => setMode('medium'));
    hardBtn.addEventListener('click', () => setMode('hard'));
    infiniteBtn.addEventListener('click', () => setMode('infinite'));

    // 每分钟更新wpm (动态)
    setInterval(() => {
      if (startTime) updateWPM();
    }, 1000);

    // 开始游戏
    function init() {
      // 设置初始模式
      currentMode = 'easy';
      easyBtn.classList.add('active');
      resetGame();  // 会填充wordList并加载第一个词
    }
    init();
  })();
</script>
</body>
</html>
