<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>2048 Pro</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="top">
        <h1>2048</h1>

        <div class="scores">
            <div class="box">
                Score
                <span id="score">0</span>
            </div>

            <div class="box">
                Best
                <span id="best">0</span>
            </div>
        </div>
    </div>

    <div id="board"></div>

    <div class="controls">
        <button onclick="undo()">Undo</button>
        <button onclick="restart()">Restart</button>
    </div>

</div>

<div id="modal" class="hidden">
    <div class="modal-content">
        <h2 id="modal-text"></h2>
        <button onclick="restart()">Play Again</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
