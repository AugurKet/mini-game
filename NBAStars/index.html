<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Legends Top Trumps</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f4f4f4;
            --accent: #ff4757;
            --win: #2ed573;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        header h1 {
            color: var(--gold);
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #scoreboard {
            font-size: 1.3rem;
            margin-top: 8px;
            font-weight: bold;
        }

        #message-board {
            height: 30px;
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
        }

        /* THE ARENA - Increased size and forced alignment */
        #arena {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch; /* Locks both slots to the same height */
            gap: 30px;
            width: 100%;
            max-width: 800px; /* Increased from 600px to make cards bigger */
        }

        .card-slot {
            display: flex;
            flex-direction: column;
            align-items: stretch; /* Stretches the card to fill the slot */
            width: 48%;
        }

        .card-slot h2 {
            margin: 0 0 10px 0;
            color: #888;
            font-size: 1rem;
            text-transform: uppercase;
            text-align: center;
        }

        /* CARD STYLING */
        .card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 2px solid var(--gold);
            border-radius: 12px;
            width: 100%;
            height: 100%; /* Forces card to fill available height */
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(90deg, #d4af37, #aa8529);
            color: #000;
            text-align: center;
            padding: 10px;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-image-container {
            width: 100%;
            aspect-ratio: 4 / 3; /* Locks to 4:3 */
            background-color: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .initials-fallback {
            font-size: 4rem;
            color: var(--gold);
            font-weight: normal;
            z-index: 1;
        }

        /* Mystery Card Styling */
        .mystery-q {
            font-size: 5rem;
            color: #555;
            z-index: 1;
        }

        .card-subtitle {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px;
            background-color: #000;
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
            text-transform: uppercase;
        }

        /* Flexible stats container to keep bottoms aligned */
        .card-stats {
            padding: 10px;
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Spaces stats evenly */
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            padding: 8px 12px;
            margin-bottom: 4px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: default;
        }

        #player-card .stat-row {
            cursor: pointer;
        }

        #player-card .stat-row:hover {
            background-color: var(--gold);
            color: #000;
            font-weight: bold;
        }

        .stat-row.winner {
            background-color: var(--win) !important;
            color: #000 !important;
            font-weight: bold;
        }

        .stat-row.loser {
            background-color: var(--accent) !important;
            color: #fff !important;
        }

        .hidden-stat {
            color: transparent;
        }

        @media (max-width: 480px) {
            .stat-row { font-size: 0.85rem; padding: 6px 8px; }
            .card-header { font-size: 0.9rem; }
            .initials-fallback { font-size: 2.5rem; }
            #arena { gap: 10px; }
        }
    </style>
</head>
<body>

            { name: "Bob Cousy", era: "1950s", position: "Point Guard", stats: { pace: 85, shooting: 78, passing: 94, dribbling: 95, defending: 75, legacy: 89 }, image: "images/bob_cousy.jpg" },
            { name: "Rick Barry", era: "1970s", position: "Small Forward", stats: { pace: 84, shooting: 92, passing: 85, dribbling: 86, defending: 82, legacy: 88 }, image: "images/rick_barry.jpg" },
            { name: "Elvin Hayes", era: "1970s", position: "Power Forward", stats: { pace: 78, shooting: 84, passing: 68, dribbling: 72, defending: 88, legacy: 88 }, image: "images/elvin_hayes.jpg" },
            { name: "George Mikan", era: "1950s", position: "Center", stats: { pace: 60, shooting: 82, passing: 65, dribbling: 60, defending: 90, legacy: 89 }, image: "images/george_mikan.jpg" },
            { name: "Willis Reed", era: "1970s", position: "Center", stats: { pace: 72, shooting: 82, passing: 70, dribbling: 68, defending: 88, legacy: 88 }, image: "images/willis_reed.jpg" },
            { name: "Walt Frazier", era: "1970s", position: "Point Guard", stats: { pace: 86, shooting: 84, passing: 90, dribbling: 92, defending: 94, legacy: 89 }, image: "images/walt_frazier.jpg" },
            { name: "Patrick Ewing", era: "1990s", position: "Center", stats: { pace: 74, shooting: 88, passing: 70, dribbling: 72, defending: 94, legacy: 88 }, image: "images/ewing.jpg" },
            { name: "Gary Payton", era: "1990s", position: "Point Guard", stats: { pace: 88, shooting: 82, passing: 92, dribbling: 90, defending: 98, legacy: 89 }, image: "images/payton.jpg" },
            { name: "Dominique Wilkins", era: "1980s", position: "Small Forward", stats: { pace: 92, shooting: 88, passing: 75, dribbling: 86, defending: 76, legacy: 88 }, image: "images/dominique_wilkins.jpg" },
            { name: "Ray Allen", era: "2000s", position: "Shooting Guard", stats: { pace: 86, shooting: 97, passing: 80, dribbling: 88, defending: 80, legacy: 88 }, image: "images/ray_allen.jpg" },
            { name: "Paul Pierce", era: "2000s", position: "Small Forward", stats: { pace: 80, shooting: 90, passing: 82, dribbling: 88, defending: 82, legacy: 88 }, image: "images/pierce.jpg" }
        ];

        // NEW LOGIC: True Deck Implementation
        let playerDeck = [];
        let compDeck = [];
        let activePlayerCard = null;
        let activeCompCard = null;
        let roundActive = false;

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        // Shuffles the master deck randomly
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Deal cards at the beginning of the game
        function initGame() {
            const shuffledDeck = shuffleArray(allPlayers);
            const halfDeck = Math.ceil(shuffledDeck.length / 2);
            
            playerDeck = shuffledDeck.slice(0, halfDeck);
            compDeck = shuffledDeck.slice(halfDeck);
            
            nextRound();
        }

        function buildCardHTML(player, isComputer = false, isRevealed = true) {
            let statsHTML = '';
            for (const [statName, statValue] of Object.entries(player.stats)) {
                const displayValue = (isComputer && !isRevealed) ? `<span class="hidden-stat val-${statName}">??</span>` : `<span class="val-${statName}">${statValue}</span>`;
                const onClick = (!isComputer) ? `onclick="playRound('${statName}')"` : '';
                
                statsHTML += `
                    <div class="stat-row" id="${isComputer ? 'comp' : 'player'}-stat-${statName}" ${onClick}>
                        <span style="text-transform: capitalize;">${statName}</span>
                        ${displayValue}
                    </div>
                `;
            }

            const displayName = (isComputer && !isRevealed) ? "OPPONENT" : player.name;
            const displaySubtitle = (isComputer && !isRevealed) ? "??? | ???" : `${player.position} | ${player.era}`;
            
            let imageContent = '';
            if (isComputer && !isRevealed) {
                imageContent = `<div class="mystery-q">?</div>`;
            } else {
                const initials = getInitials(player.name);
                imageContent = `
                    <div class="initials-fallback">${initials}</div>
                    <img src="${player.image}" alt="${player.name}" onerror="this.style.display='none'">
                `;
            }

            return `
                <div class="card">
                    <div class="card-header">${displayName}</div>
                    <div class="card-image-container">
                        ${imageContent}
                    </div>
                    <div class="card-subtitle">${displaySubtitle}</div>
                    <div class="card-stats">
                        ${statsHTML}
                    </div>
                </div>
            `;
        }

        function nextRound() {
            // Check win conditions
            if (playerDeck.length === 0) {
                document.getElementById('message-board').innerText = "Game Over! You lost all your cards.";
                document.getElementById('message-board').style.color = "var(--accent)";
                return;
            }
            if (compDeck.length === 0) {
                document.getElementById('message-board').innerText = "Congratulations! You collected all legends!";
                document.getElementById('message-board').style.color = "var(--win)";
                return;
            }

            roundActive = true;
            document.getElementById('message-board').innerText = "Select a stat to challenge!";
            document.getElementById('message-board').style.color = "var(--gold)";

            // Update UI Counters based on array lengths
            document.getElementById('score-player').innerText = playerDeck.length;
            document.getElementById('score-comp').innerText = compDeck.length;

            // Look at the top card of both decks
            activePlayerCard = playerDeck[0];
            activeCompCard = compDeck[0];

            // Render UI
            document.getElementById('player-card').innerHTML = buildCardHTML(activePlayerCard, false, true);
            document.getElementById('computer-card').innerHTML = buildCardHTML(activeCompCard, true, false);
        }

        function playRound(statSelected) {
            if (!roundActive) return;
            roundActive = false;

            // Reveal computer card
            document.getElementById('computer-card').innerHTML = buildCardHTML(activeCompCard, true, true);

            const playerVal = activePlayerCard.stats[statSelected];
            const compVal = activeCompCard.stats[statSelected];

            const pRow = document.getElementById(`player-stat-${statSelected}`);
            const cRow = document.getElementById(`comp-stat-${statSelected}`);
            const msg = document.getElementById('message-board');

            if (playerVal > compVal) {
                pRow.classList.add('winner');
                cRow.classList.add('loser');
                msg.innerText = "You Win! Loading next...";
                msg.style.color = "var(--win)";
                
                // Player wins: take comp's top card, put both at bottom of player's deck
                playerDeck.push(playerDeck.shift());
                playerDeck.push(compDeck.shift());

            } else if (compVal > playerVal) {
                pRow.classList.add('loser');
                cRow.classList.add('winner');
                msg.innerText = "Computer Wins! Loading next...";
                msg.style.color = "var(--accent)";
                
                // Computer wins: take player's top card, put both at bottom of comp's deck
                compDeck.push(compDeck.shift());
                compDeck.push(playerDeck.shift());

            } else {
                pRow.style.backgroundColor = "gray";
                cRow.style.backgroundColor = "gray";
                msg.innerText = "Draw! Loading next...";
                msg.style.color = "var(--text-light)";
                
                // Draw: Put cards to the bottom of their respective decks
                playerDeck.push(playerDeck.shift());
                compDeck.push(compDeck.shift());
            }

            // Temporarily update counters before next round starts
            document.getElementById('score-player').innerText = playerDeck.length;
            document.getElementById('score-comp').innerText = compDeck.length;

            setTimeout(nextRound, 1500);
        }

        // Start game on load
        window.onload = initGame;
    </script>
</body>
</html>
