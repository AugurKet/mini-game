<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋转数迷 · 全菱形可点 (上下分色)</title>
    <style>
        body {
            background: #2b3e4f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .game-wrapper {
            background: #f5efe6;
            border-radius: 40px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            background: white;
            box-shadow: inset 0 0 0 1px #ccc;
            width: 100%;
            height: auto;
            max-width: 800px;
            touch-action: none;
        }
        .info-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #1e2b36;
            font-weight: 600;
        }
        button {
            background: #ffb347;
            border: none;
            border-radius: 40px;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: bold;
            color: #1e2b36;
            cursor: pointer;
            box-shadow: 0 4px 0 #b16300;
            transition: 0.1s ease;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .status {
            background: #d9e2e8;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info-panel">
        <span class="status" id="gameStatus">⚪ 继续努力</span>
        <button id="resetBtn">新一局</button>
    </div>
</div>
<script>
(function() {
    // ----- 固定配置：菱形布局（第一排1个，第二排2个，第三排3个，第四排2个，第五排1个）-----
    const rows = [1, 2, 3, 2, 1]; 
    const diamondCount = rows.reduce((a, b) => a + b, 0); // 9

    // 菱形中心坐标 (r, c) 手动定义，保证对称
    const diamondPositions = [
        {r:0, c:2},          // 第0行
        {r:1, c:1}, {r:1, c:2}, // 第1行
        {r:2, c:0}, {r:2, c:1}, {r:2, c:2}, // 第2行
        {r:3, c:1}, {r:3, c:2}, // 第3行
        {r:4, c:2}           // 第4行
    ];

    // ----- 构建所有圆圈（顶点）-----
    // 每个菱形的四个顶点：上、下、左、右（基于菱形中心坐标）
    const vertexMap = new Map(); // 键 "r,c" -> 索引
    const vertexCoords = [];     // 每个顶点坐标 {r, c}

    diamondPositions.forEach(d => {
        const neighbors = [
            {r: d.r-1, c: d.c}, // 上
            {r: d.r+1, c: d.c}, // 下
            {r: d.r, c: d.c-1}, // 左
            {r: d.r, c: d.c+1}  // 右
        ];
        neighbors.forEach(n => {
            const key = n.r + ',' + n.c;
            if (!vertexMap.has(key)) {
                vertexMap.set(key, vertexCoords.length);
                vertexCoords.push({r: n.r, c: n.c});
            }
        });
    });

    const vertexCount = vertexCoords.length; // 应为21
    console.log('顶点数量:', vertexCount);

    // 顶点数字数组（动态更新）
    let vertexNumbers = new Array(vertexCount);

    // ----- 建立每个菱形到其四个顶点的映射（存储顶点索引），顺序：上、右、下、左（顺时针）-----
    const diamondVertices = diamondPositions.map(d => {
        const up = vertexMap.get((d.r-1) + ',' + d.c);
        const down = vertexMap.get((d.r+1) + ',' + d.c);
        const left = vertexMap.get(d.r + ',' + (d.c-1));
        const right = vertexMap.get(d.r + ',' + (d.c+1));
        return [up, right, down, left]; // 顺时针顺序
    });

    // ----- 菱形数据：每个菱形的上面数字（动态）、下面答案（固定）-----
    let diamonds = diamondPositions.map((pos, idx) => {
        return {
            r: pos.r,
            c: pos.c,
            answer: 0, // 稍后初始化
            top: 0,
            vertices: diamondVertices[idx]
        };
    });

    // 计算一个菱形的上面数字（四个顶点之和）
    function computeTop(vertices) {
        return vertices.reduce((sum, vIdx) => sum + vertexNumbers[vIdx], 0);
    }

    // 重新计算所有菱形的上面数字并更新
    function updateAllTops() {
        diamonds.forEach(d => {
            d.top = computeTop(d.vertices);
        });
    }

    // ----- 重置游戏：随机生成11~50的数字，并设置答案为当前和（初始全绿）-----
    function resetGame() {
        // 随机生成顶点数字 (11~50)
        for (let i = 0; i < vertexCount; i++) {
            vertexNumbers[i] = Math.floor(Math.random() * 40) + 11; // 11~50
        }
        // 更新上面数字
        updateAllTops();
        // 将每个菱形的答案设为当前上面数字（初始全绿）
        diamonds.forEach(d => {
            d.answer = d.top;
        });
        draw();
    }

    // ----- 顺时针旋转四个顶点数字（上->右->下->左->上）-----
    function rotateClockwise(vertexIndices) {
        if (vertexIndices.length !== 4) return;
        const [up, right, down, left] = vertexIndices;
        const temp = vertexNumbers[up];
        vertexNumbers[up] = vertexNumbers[left];   // 左 -> 上
        vertexNumbers[left] = vertexNumbers[down]; // 下 -> 左
        vertexNumbers[down] = vertexNumbers[right];// 右 -> 下
        vertexNumbers[right] = temp;                // 上 -> 右
    }

    // ----- 画布绘制-----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('gameStatus');
    const resetBtn = document.getElementById('resetBtn');

    // 网格坐标到像素的转换
    const offsetX = 300;
    const offsetY = 200;
    const spacing = 60;

    function getPixel(r, c) {
        return {
            x: c * spacing + offsetX,
            y: r * spacing + offsetY
        };
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 绘制所有菱形（先画填充，再画边框，避免覆盖）
        diamonds.forEach(d => {
            const points = d.vertices.map(vIdx => getPixel(vertexCoords[vIdx].r, vertexCoords[vIdx].c));
            // 上半三角形：上、左、右
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y); // 上
            ctx.lineTo(points[3].x, points[3].y); // 左
            ctx.lineTo(points[1].x, points[1].y); // 右
            ctx.closePath();
            // 根据上下相等设置上半填充色
            ctx.fillStyle = (d.top === d.answer) ? 'rgba(144, 238, 144, 0.6)' : 'rgba(255, 100, 100, 0.6)';
            ctx.fill();

            // 下半三角形：下、左、右
            ctx.beginPath();
            ctx.moveTo(points[2].x, points[2].y); // 下
            ctx.lineTo(points[3].x, points[3].y); // 左
            ctx.lineTo(points[1].x, points[1].y); // 右
            ctx.closePath();
            ctx.fillStyle = 'rgba(220, 220, 220, 0.3)'; // 下半固定浅灰
            ctx.fill();

            // 绘制菱形边框（黑色细线）
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y); // 上
            ctx.lineTo(points[1].x, points[1].y); // 右
            ctx.lineTo(points[2].x, points[2].y); // 下
            ctx.lineTo(points[3].x, points[3].y); // 左
            ctx.closePath();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        });

        // 2. 绘制圆圈（顶点）及数字（在菱形上层，避免被填充挡住）
        vertexCoords.forEach((v, idx) => {
            const {x, y} = getPixel(v.r, v.c);
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#f0f0f0';
            ctx.fill();
            ctx.strokeStyle = '#2b5797';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillStyle = '#1e2b36';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(vertexNumbers[idx], x, y);
        });

        // 3. 绘制菱形内的上下数字
        diamonds.forEach(d => {
            const center = getPixel(d.r, d.c);
            // 上面数字（动态）
            ctx.font = 'bold 22px "Segoe UI"';
            ctx.fillStyle = '#2c3e50';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(d.top, center.x, center.y - 10);
            // 下面数字（答案）
            ctx.font = 'bold 22px "Segoe UI"';
            ctx.fillStyle = '#8e44ad';
            ctx.textBaseline = 'top';
            ctx.fillText(d.answer, center.x, center.y + 10);
        });

        // 4. 更新状态文字
        const allGreen = diamonds.every(d => d.top === d.answer);
        statusEl.innerText = allGreen ? '✅ 胜利！所有菱形变绿！' : '⚪ 继续努力';
    }

    // ----- 点击检测：找到被点击的菱形（所有菱形均可点击）-----
    function getClickedDiamond(px, py) {
        const threshold = 30;
        for (let d of diamonds) {
            const center = getPixel(d.r, d.c);
            const dist = Math.hypot(px - center.x, py - center.y);
            if (dist < threshold) return d;
        }
        return null;
    }

    // 处理点击（触摸）
    function handleCanvasClick(e) {
        e.preventDefault(); // 防止移动端滚动
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;

        const clicked = getClickedDiamond(canvasX, canvasY);
        if (clicked) {
            // 点击任意菱形，旋转它周围的四个圆圈
            rotateClockwise(clicked.vertices);
            // 重新计算所有菱形的上面数字
            updateAllTops();
            draw();
        }
    }

    // 事件绑定
    canvas.addEventListener('mousedown', handleCanvasClick);
    canvas.addEventListener('touchstart', handleCanvasClick, { passive: false });
    resetBtn.addEventListener('click', resetGame);

    // 初始化
    resetGame();
})();
</script>
</body>
</html>
