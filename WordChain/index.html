<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Word Chain · change one letter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0e1625 0%, #1b2a40 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .game-container {
      max-width: 900px;
      width: 100%;
      background: rgba(12, 24, 40, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 60px;
      border: 2px solid #3f6ab0;
      box-shadow: 0 30px 45px -15px #000, 0 0 0 1px #6f91d0 inset;
      padding: 30px 25px 35px;
    }
    h1 {
      text-align: center;
      font-size: 52px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffe484, #ffad5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      filter: drop-shadow(0 4px 6px #000000b0);
      margin-bottom: 5px;
    }
    .sub {
      text-align: center;
      color: #b9d4ff;
      font-size: 20px;
      margin-bottom: 25px;
    }
    .rule-badge {
      display: flex;
      justify-content: center;
      gap: 30px;
      background: #1a314f;
      border-radius: 60px;
      padding: 18px 25px;
      margin-bottom: 25px;
      border: 1px solid #5f86c0;
      flex-wrap: wrap;
    }
    .rule-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffe4a2;
      font-size: 20px;
      font-weight: 600;
    }
    .rule-item span {
      background: #2b4a78;
      padding: 8px 16px;
      border-radius: 40px;
      color: #ffd966;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      background: #102844;
      border-radius: 80px;
      padding: 16px 28px;
      margin-bottom: 25px;
      border: 1px solid #4d79b6;
    }
    .stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .stat-label {
      color: #c0d9ff;
      font-size: 18px;
      text-transform: uppercase;
    }
    .stat-value {
      color: #ffe484;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }
    .chain-area {
      background: #0c223c;
      border-radius: 50px;
      padding: 30px 20px;
      border: 3px solid #3d6bb5;
      box-shadow: inset 0 5px 12px #000000b0;
      margin-bottom: 20px;
    }
    .current-word {
      text-align: center;
      font-size: 90px;
      font-weight: 800;
      color: #ffe484;
      text-shadow: 0 8px 0 #826e38, 0 15px 25px black;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin: 15px 0 20px;
      word-break: break-word;
    }
    .chain-history {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 20px;
      margin: 20px 0 15px;
      min-height: 60px;
      padding: 10px;
      background: #153053;
      border-radius: 60px;
    }
    .chain-word {
      background: #1f3f68;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2px solid #ffbc6c;
      color: #ffde9e;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .input-panel {
      display: flex;
      gap: 15px;
      background: #102f52;
      border-radius: 120px;
      padding: 8px 8px 8px 30px;
      border: 2px solid #5885cc;
      margin: 25px 0 20px;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 42px;
      font-weight: 600;
      outline: none;
      min-width: 0;
      text-transform: uppercase;
      font-family: 'Fira Mono', monospace;
    }
    #userInput::placeholder {
      color: #2f5690;
      font-size: 32px;
    }
    .submit-btn {
      background: #1f8b4c;
      border: none;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      color: white;
      font-size: 48px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 0 #0f4429;
      transition: 0.05s linear;
    }
    .submit-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #0f4429;
    }
    .submit-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 18px;
      margin: 10px 0 20px;
    }
    .action-btn {
      flex: 1;
      background: #2b4f82;
      border: none;
      padding: 18px 0;
      border-radius: 60px;
      font-size: 28px;
      font-weight: 700;
      color: #e3f0ff;
      cursor: pointer;
      box-shadow: 0 7px 0 #142b48;
      transition: 0.05s linear;
      border: 1px solid #779bd1;
    }
    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #142b48;
    }
    .message-box {
      background: #1a3457;
      border-radius: 40px;
      padding: 18px 25px;
      margin: 15px 0 10px;
      border-left: 8px solid #ffb85c;
      color: #d4e6ff;
      font-size: 22px;
      font-weight: 500;
    }
    .difficulty-selector {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
    }
    .difficulty-btn {
      border: none;
      background: #253f63;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      color: #cadeff;
      cursor: pointer;
      box-shadow: 0 6px 0 #112439;
      transition: 0.06s;
      border: 1px solid #6182bb;
    }
    .difficulty-btn.active {
      background: #2e7d32;
      color: white;
      box-shadow: 0 3px 0 #1e5622;
      transform: translateY(3px);
      border-color: #a5d6a7;
    }
    .footer {
      text-align: center;
      color: #6f94c7;
      margin-top: 25px;
      font-size: 18px;
    }
    @media (max-width: 600px) {
      .current-word { font-size: 60px; }
      .stat-value { font-size: 32px; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>🔗 WORD CHAIN</h1>
  <div class="sub">change one letter · make a new word</div>

  <!-- rules reminder -->
  <div class="rule-badge">
    <div class="rule-item">🎯 <span>change 1 letter</span></div>
    <div class="rule-item">📏 <span>same length</span></div>
    <div class="rule-item">📖 <span>real English word</span></div>
  </div>

  <!-- stats: chain length & time -->
  <div class="stats-row">
    <div class="stat">
      <span class="stat-label">chain</span>
      <span class="stat-value" id="chainLength">1</span>
    </div>
    <div class="stat">
      <span class="stat-label">⏱️</span>
      <span class="stat-value" id="timerDisplay">00</span>
    </div>
    <div class="stat">
      <span class="stat-label">best</span>
      <span class="stat-value" id="bestChain">0</span>
    </div>
  </div>

  <!-- main play area -->
  <div class="chain-area">
    <div class="current-word" id="currentWord">CAT</div>

    <!-- chain history (recent words) -->
    <div class="chain-history" id="chainHistory">
      <span class="chain-word">CAT</span>
    </div>

    <!-- input + submit -->
    <div class="input-panel">
      <input type="text" id="userInput" placeholder="NEXT WORD" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="submit-btn" id="submitBtn">↵</button>
    </div>

    <!-- action buttons -->
    <div class="action-row">
      <button class="action-btn" id="newGameBtn">🔄 NEW CHAIN</button>
      <button class="action-btn" id="hintBtn">💡 HINT</button>
    </div>
  </div>

  <!-- message area (feedback) -->
  <div class="message-box" id="messageBox">
    💡 Start from CAT. Change one letter to form a new word.
  </div>

  <!-- difficulty (word length) -->
  <div class="difficulty-selector">
    <button id="easyLen" class="difficulty-btn active">3 letters</button>
    <button id="medLen" class="difficulty-btn">4 letters</button>
    <button id="hardLen" class="difficulty-btn">5 letters</button>
  </div>
  <div class="footer">✔️ real words only · keep the chain going</div>
</div>

<script>
  (function() {
    // ---------- ENGLISH WORD LIBRARIES (by length) ----------
    const words3 = [
      "cat", "dog", "sun", "car", "bus", "hat", "bat", "ball", "book", "pen", "cup", "bed", "red", "blue", "fish",
      "bird", "tree", "star", "moon", "cake", "milk", "egg", "apple", "happy", "house", "mouse", "phone", "table",
      "chair", "door", "window", "paper", "pencil", "teacher", "student", "school", "garden", "flower", "grass",
      "water", "fire", "rain", "snow", "wind", "cloud", "sky", "night", "day", "week", "month", "year", "time",
      "clock", "watch", "shoe", "sock", "shirt", "pants", "dress", "skirt", "coat", "hat", "glove", "scarf", "boot",
      "sand", "rock", "stone", "hill", "mountain", "river", "lake", "ocean", "sea", "beach", "island", "forest",
      "desert", "cave", "volcano", "tiger", "lion", "bear", "wolf", "fox", "deer", "zebra", "giraffe", "monkey",
      "elephant", "snake", "lizard", "frog", "bug", "ant", "bee", "fly", "spider", "worm", "snail"
    ].filter(w => w.length === 3); // ensure only 3-letter

    const words4 = [
      "time", "year", "week", "day", "night", "moon", "star", "tree", "fish", "bird", "lion", "bear", "wolf",
      "deer", "frog", "snake", "worm", "ant", "bee", "spider", "fly", "bug", "cat", "dog", "sun", "car", "bus",
      "hat", "ball", "book", "pen", "cup", "bed", "red", "blue", "cake", "milk", "egg", "apple", "happy",
      "house", "mouse", "phone", "table", "chair", "door", "window", "paper", "pencil", "school", "garden",
      "flower", "grass", "water", "fire", "rain", "snow", "wind", "cloud", "sky", "clock", "watch", "shoe",
      "sock", "shirt", "pants", "dress", "skirt", "coat", "glove", "scarf", "boot", "sand", "rock", "stone",
      "hill", "river", "lake", "ocean", "sea", "beach", "island", "forest", "desert", "cave", "zebra", "monkey"
    ].filter(w => w.length === 4);

    const words5 = [
      "apple", "happy", "house", "mouse", "phone", "table", "chair", "door", "window", "paper", "pencil",
      "teacher", "student", "school", "garden", "flower", "grass", "water", "fire", "rain", "snow", "wind",
      "cloud", "sky", "night", "day", "week", "month", "year", "time", "clock", "watch", "shoe", "sock",
      "shirt", "pants", "dress", "skirt", "coat", "glove", "scarf", "boot", "sand", "rock", "stone", "hill",
      "mountain", "river", "lake", "ocean", "sea", "beach", "island", "forest", "desert", "cave", "volcano",
      "tiger", "lion", "bear", "wolf", "fox", "deer", "zebra", "giraffe", "monkey", "elephant", "snake",
      "lizard", "frog", "bug", "ant", "bee", "fly", "spider", "worm", "snail"
    ].filter(w => w.length === 5);

    // ---------- game state ----------
    let currentLength = 3;
    let wordList = words3;           // current dictionary
    let chain = [];                  // array of words in current chain
    let startTime = null;
    let timerInterval = null;
    let gameActive = true;
    let bestChain = 0;

    // load best from storage
    try {
      const saved = localStorage.getItem('wordChainBest');
      if (saved) bestChain = parseInt(saved);
    } catch (e) {}

    // DOM elements
    const currentWordEl = document.getElementById('currentWord');
    const chainHistoryEl = document.getElementById('chainHistory');
    const userInput = document.getElementById('userInput');
    const submitBtn = document.getElementById('submitBtn');
    const newGameBtn = document.getElementById('newGameBtn');
    const hintBtn = document.getElementById('hintBtn');
    const messageBox = document.getElementById('messageBox');
    const chainLengthSpan = document.getElementById('chainLength');
    const timerDisplay = document.getElementById('timerDisplay');
    const bestChainSpan = document.getElementById('bestChain');
    const easyBtn = document.getElementById('easyLen');
    const medBtn = document.getElementById('medLen');
    const hardBtn = document.getElementById('hardLen');

    // init display
    bestChainSpan.textContent = bestChain;

    // ---------- helper functions ----------
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      startTime = Date.now();
      timerInterval = setInterval(() => {
        if (!gameActive) return;
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');
        timerDisplay.textContent = `${mins}:${secs}`;
      }, 100);
    }

    // reset for new chain
    function startNewChain(initialWord) {
      chain = [initialWord];
      renderChain();
      currentWordEl.textContent = initialWord.toUpperCase();
      userInput.value = '';
      gameActive = true;
      stopTimer();
      startTimer();
      updateChainLength();
      messageBox.textContent = `🔤 New chain! Start from "${initialWord.toUpperCase()}"`;
    }

    // pick random word from current wordList
    function randomWord() {
      return wordList[Math.floor(Math.random() * wordList.length)];
    }

    // check if two words differ by exactly one letter
    function oneLetterDiff(a, b) {
      if (a.length !== b.length) return false;
      let diff = 0;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) diff++;
        if (diff > 1) return false;
      }
      return diff === 1;
    }

    // check if word exists in dictionary (case-insensitive)
    function isValidWord(word) {
      return wordList.includes(word.toLowerCase());
    }

    // render chain history (last few words)
    function renderChain() {
      const lastFew = chain.slice(-5); // show last 5
      chainHistoryEl.innerHTML = lastFew.map(w => `<span class="chain-word">${w.toUpperCase()}</span>`).join('');
    }

    function updateChainLength() {
      chainLengthSpan.textContent = chain.length;
      if (chain.length > bestChain) {
        bestChain = chain.length;
        bestChainSpan.textContent = bestChain;
        localStorage.setItem('wordChainBest', bestChain);
      }
    }

    // try to add new word
    function addWord(newWord) {
      if (!gameActive) {
        messageBox.textContent = '⏸️ Game over. Start a new chain.';
        return false;
      }
      if (!isValidWord(newWord)) {
        messageBox.textContent = `❌ "${newWord.toUpperCase()}" is not in my dictionary.`;
        return false;
      }
      const lastWord = chain[chain.length - 1];
      if (!oneLetterDiff(lastWord, newWord)) {
        messageBox.textContent = `⚠️ Must change exactly one letter from "${lastWord.toUpperCase()}".`;
        return false;
      }
      if (chain.includes(newWord)) {
        messageBox.textContent = `⛔ "${newWord.toUpperCase()}" already used in this chain.`;
        return false;
      }

      // valid move
      chain.push(newWord);
      currentWordEl.textContent = newWord.toUpperCase();
      userInput.value = '';
      renderChain();
      updateChainLength();
      messageBox.textContent = `✅ Good! Chain now ${chain.length} words.`;
      return true;
    }

    // hint: find a valid next word
    function giveHint() {
      if (!gameActive || chain.length === 0) return;
      const last = chain[chain.length - 1];
      // look for any word in dictionary that differs by one letter and not used
      const candidates = wordList.filter(w => 
        w.length === last.length && 
        oneLetterDiff(last, w) && 
        !chain.includes(w)
      );
      if (candidates.length === 0) {
        messageBox.textContent = '😕 No possible continuation found. Try new chain?';
        return;
      }
      const hintWord = candidates[Math.floor(Math.random() * candidates.length)];
      messageBox.textContent = `💡 Hint: try "${hintWord.toUpperCase()}"`;
    }

    // change difficulty (word length)
    function setLength(len) {
      currentLength = len;
      if (len === 3) {
        wordList = words3;
        easyBtn.classList.add('active');
        medBtn.classList.remove('active');
        hardBtn.classList.remove('active');
      } else if (len === 4) {
        wordList = words4;
        easyBtn.classList.remove('active');
        medBtn.classList.add('active');
        hardBtn.classList.remove('active');
      } else {
        wordList = words5;
        easyBtn.classList.remove('active');
        medBtn.classList.remove('active');
        hardBtn.classList.add('active');
      }
      // start fresh chain with random word of new length
      const startWord = randomWord();
      startNewChain(startWord);
    }

    // ---------- event listeners ----------
    submitBtn.addEventListener('click', () => {
      const raw = userInput.value.trim().toLowerCase();
      if (raw === '') {
        messageBox.textContent = '✏️ Type a word first.';
        return;
      }
      addWord(raw);
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitBtn.click();
      }
    });

    newGameBtn.addEventListener('click', () => {
      const startWord = randomWord();
      startNewChain(startWord);
    });

    hintBtn.addEventListener('click', giveHint);

    easyBtn.addEventListener('click', () => setLength(3));
    medBtn.addEventListener('click', () => setLength(4));
    hardBtn.addEventListener('click', () => setLength(5));

    // initialize
    setLength(3);
  })();
</script>
</body>
</html>
