<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国卡牌对决</title>
    <link rel="stylesheet" href="style.css?v=99">
</head>
<body>
    <!-- 新增：右上角的音乐控制按钮与隐藏的播放器 -->
    <button id="bgm-btn" onclick="toggleBGM()">🎵 播放战歌</button>
    <audio id="bgm" src="Images/bgm.mp3" loop></audio>
    
    <h1>三国卡牌对决 (Top Trumps)</h1>
    <div class="game-board">
        <div class="player-area">
            <h2>你的卡牌 (<span id="player-count">16</span>)</h2>
            <div id="player-card" class="card">
                <img id="player-img" src="" alt="武将画像">
                <h3 id="player-name">武将名</h3>
                <div class="stats">
                    <button onclick="playRound('force')">武力: <span id="p-force"></span></button>
                    <button onclick="playRound('intelligence')">智力: <span id="p-intelligence"></span></button>
                    <button onclick="playRound('leadership')">统帅: <span id="p-leadership"></span></button>
                    <button onclick="playRound('vitality')">体质: <span id="p-vitality"></span></button>
                    <button onclick="playRound('charisma')">魅力: <span id="p-charisma"></span></button>
                </div>
            </div>
        </div>

        <div class="center-area">
            <h2 id="round-result">点击你的属性开始比拼！</h2>
        </div>

        <div class="cpu-area">
            <h2>对手卡牌 (<span id="cpu-count">16</span>)</h2>
            <div id="cpu-card" class="card hidden-card">
                <img id="cpu-img" src="" alt="未知">
                <h3 id="cpu-name">???</h3>
                <div class="stats">
                    <p>武力: <span id="c-force">?</span></p>
                    <p>智力: <span id="c-intelligence">?</span></p>
                    <p>统帅: <span id="c-leadership">?</span></p>
                    <p>体质: <span id="c-vitality">?</span></p>
                    <p>魅力: <span id="c-charisma">?</span></p>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
    <!-- 游戏结束史诗画面 -->
    <div id="end-screen" class="hidden-screen">
        <h1 id="end-title" class="glow-text">天下无双！</h1>
        <p id="end-desc">你赢得了所有武将，一统三国！</p>
        <button class="restart-btn" onclick="location.reload()">再战一局</button>
    </div>
    
    <script src="game.js"></script> <!-- 确保这段在你的 script 之上 -->
</body>
</html>
