<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legends Top Trumps - Mobile Ready</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f4f4f4;
            --accent: #ff4757;
            --win: #2ed573;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
        }

        header h1 {
            color: var(--gold);
            margin: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #scoreboard {
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: bold;
        }

        #message-board {
            height: 25px;
            font-size: 1rem;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        /* The Arena - Forced Side-by-Side */
        #arena {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            max-width: 600px; /* Keeps it compact on desktop */
        }

        .card-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 48%; /* Forces them to sit side-by-side even on small screens */
        }

        .card-slot h2 {
            margin: 0 0 5px 0;
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        /* Card Styling */
        .card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 2px solid var(--gold);
            border-radius: 10px;
            width: 100%;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(90deg, #d4af37, #aa8529);
            color: #000;
            text-align: center;
            padding: 6px;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Adds "..." if name is too long for small screen */
        }

        /* 4:3 Aspect Ratio Image Container */
        .card-image-container {
            width: 100%;
            aspect-ratio: 4 / 3; /* Locks the box to 4:3 proportion */
            background-color: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* The initials styling if the image is missing (e.g. FB or LF) */
        .initials-fallback {
            font-size: 3rem;
            color: var(--gold);
            font-weight: normal;
            z-index: 1;
        }

        .card-subtitle {
            text-align: center;
            font-size: 0.7rem;
            padding: 4px;
            background-color: #000;
            color: var(--gold);
            border-bottom: 1px solid var(--gold);
            text-transform: uppercase;
        }

        .card-stats {
            padding: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 5px 8px;
            margin-bottom: 3px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: default;
        }

        #player-card .stat-row {
            cursor: pointer;
        }

        #player-card .stat-row:hover {
            background-color: var(--gold);
            color: #000;
            font-weight: bold;
        }

        .stat-row.winner {
            background-color: var(--win) !important;
            color: #000 !important;
            font-weight: bold;
        }

        .stat-row.loser {
            background-color: var(--accent) !important;
            color: #fff !important;
        }

        .hidden-stat {
            color: transparent;
            text-shadow: 0 0 6px rgba(255,255,255,0.4);
        }

        /* Extra adjustments for very small phones */
        @media (max-width: 380px) {
            .stat-row { font-size: 0.75rem; padding: 4px 5px; }
            .card-header { font-size: 0.8rem; }
            .initials-fallback { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    { name: "Roberto Baggio", era: "1990s", position: "Attacker", stats: { pace: 85, shooting: 90, passing: 92, dribbling: 95, defending: 35, legacy: 93 }, image: "images/baggio.jpg" },
    { name: "Gabriel Batistuta", era: "1990s", position: "Attacker", stats: { pace: 86, shooting: 97, passing: 70, dribbling: 82, defending: 40, legacy: 91 }, image: "images/batistuta.jpg" },

    { name: "Francesco Totti", era: "2000s", position: "Attacker", stats: { pace: 78, shooting: 91, passing: 94, dribbling: 90, defending: 42, legacy: 92 }, image: "images/totti.jpg" },
    { name: "Wayne Rooney", era: "2000s", position: "Attacker", stats: { pace: 86, shooting: 92, passing: 86, dribbling: 85, defending: 68, legacy: 91 }, image: "images/rooney.jpg" },
    { name: "Dennis Bergkamp", era: "1990s", position: "Attacker", stats: { pace: 82, shooting: 90, passing: 94, dribbling: 96, defending: 35, legacy: 92 }, image: "images/bergkamp.jpg" },
    { name: "Zlatan Ibrahimović", era: "2010s", position: "Attacker", stats: { pace: 78, shooting: 95, passing: 84, dribbling: 90, defending: 40, legacy: 93 }, image: "images/ibrahimovic.jpg" },
    { name: "Luís Figo", era: "2000s", position: "Attacker", stats: { pace: 88, shooting: 84, passing: 93, dribbling: 95, defending: 45, legacy: 92 }, image: "images/figo.jpg" },
    { name: "Romário", era: "1990s", position: "Attacker", stats: { pace: 92, shooting: 97, passing: 78, dribbling: 94, defending: 25, legacy: 94 }, image: "images/romario.jpg" }
];

        let playerScore = 0;
        let compScore = 0;
        let activePlayerCard = null;
        let activeCompCard = null;
        let roundActive = true;

        // Extract initials for the text fallback (e.g., Franz Beckenbauer -> FB)
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function getRandomCard() {
            const randomIndex = Math.floor(Math.random() * allPlayers.length);
            return allPlayers[randomIndex];
        }

        function buildCardHTML(player, isComputer = false) {
            let statsHTML = '';
            for (const [statName, statValue] of Object.entries(player.stats)) {
                const displayValue = isComputer ? `<span class="hidden-stat val-${statName}">${statValue}</span>` : `<span class="val-${statName}">${statValue}</span>`;
                const onClick = (!isComputer) ? `onclick="playRound('${statName}')"` : '';
                
                statsHTML += `
                    <div class="stat-row" id="${isComputer ? 'comp' : 'player'}-stat-${statName}" ${onClick}>
                        <span style="text-transform: capitalize;">${statName}</span>
                        ${displayValue}
                    </div>
                `;
            }

            const initials = getInitials(player.name);

            return `
                <div class="card">
                    <div class="card-header">${player.name}</div>
                    <div class="card-image-container">
                        <div class="initials-fallback">${initials}</div>
                        <!-- If the image path fails, the image hides and shows the initials underneath -->
                        <img src="${player.image}" alt="${player.name}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-subtitle">${player.position} | ${player.era}</div>
                    <div class="card-stats">
                        ${statsHTML}
                    </div>
                </div>
            `;
        }

        function nextRound() {
            roundActive = true;
            document.getElementById('message-board').innerText = "Select a stat to challenge!";
            document.getElementById('message-board').style.color = "var(--gold)";

            activePlayerCard = getRandomCard();
            activeCompCard = getRandomCard();

            while(activeCompCard.name === activePlayerCard.name) {
                activeCompCard = getRandomCard();
            }

            document.getElementById('player-card').innerHTML = buildCardHTML(activePlayerCard, false);
            document.getElementById('computer-card').innerHTML = buildCardHTML(activeCompCard, true);
        }

        function playRound(statSelected) {
            if (!roundActive) return;
            roundActive = false;

            const playerVal = activePlayerCard.stats[statSelected];
            const compVal = activeCompCard.stats[statSelected];

            const hiddenStats = document.querySelectorAll('.hidden-stat');
            hiddenStats.forEach(el => el.classList.remove('hidden-stat'));

            const pRow = document.getElementById(`player-stat-${statSelected}`);
            const cRow = document.getElementById(`comp-stat-${statSelected}`);
            const msg = document.getElementById('message-board');

            if (playerVal > compVal) {
                pRow.classList.add('winner');
                cRow.classList.add('loser');
                msg.innerText = "You Win! Next player in 1s...";
                msg.style.color = "var(--win)";
                playerScore++;
            } else if (compVal > playerVal) {
                pRow.classList.add('loser');
                cRow.classList.add('winner');
                msg.innerText = "Computer Wins! Next player in 1s...";
                msg.style.color = "var(--accent)";
                compScore++;
            } else {
                pRow.style.backgroundColor = "gray";
                cRow.style.backgroundColor = "gray";
                msg.innerText = "Draw! Next player in 1s...";
                msg.style.color = "var(--text-light)";
            }

            document.getElementById('score-player').innerText = playerScore;
            document.getElementById('score-comp').innerText = compScore;

            // Wait exactly 1 second (1000 milliseconds) before dealing the next cards
            setTimeout(nextRound, 1000);
        }

        window.onload = nextRound;
    </script>
</body>
</html>
